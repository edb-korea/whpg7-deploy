---
# ======================================================
# Ansible Vault 민감 변수 파일
# 실제 사용 시 반드시 vault로 암호화하세요:
#   ansible-vault encrypt inventory/vault.yml
#
# site.yml 실행 시:
#   ansible-playbook playbooks/site.yml --ask-vault-pass
# ======================================================

# gpadmin 비밀번호
vault_gpadmin_password: "changeme_strong_password"

# keepalived 인증 비밀번호
vault_keepalived_auth_pass: "changeme_ha_pass"

# pgBouncer auth (선택)
vault_pgbouncer_auth_password: "changeme_bouncer"

# WEM admin 비밀번호 (최초 설치 시에만 적용)
vault_wem_admin_password: "changeme_wem"

# WEM 이 WHPG 에 접속하는 계정(wemon) 비밀번호 (상태 DB 계정도 같은 값)
vault_wem_whpg_password: "changeme_wemon"

# ClickHouse default 사용자 비밀번호
vault_clickhouse_password: "changeme_clickhouse"
