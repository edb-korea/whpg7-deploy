---
# ======================================================
# WEM 1.4 설치 (단독 실행)
#   WEM / ClickHouse      : wem_node 그룹 (기본 standby)
#   Host Agent / otelcol  : 모든 노드
#   WEM 1.2/1.3(Prometheus / Loki / Alloy) 이 있으면 먼저 삭제
#
#   ansible-playbook playbooks/07_wem.yml
#   ansible-playbook playbooks/07_wem.yml -e wem_use_vip=false  # VIP 대신 coordinator 실 IP 로 접속
#
#   coordinator_ha_enabled=true 면 VIP(coordinator_vip)로 접속하므로 06_coordinator_ha.yml 이후에 실행
#   ansible-playbook playbooks/07_wem.yml -t tune               # 일부 단계만 (README WEM 절의 tag 표)
#   ansible-playbook playbooks/07_wem.yml -t upgrade --check    # 관련 RPM 의 설치 / repo 최신 버전 확인만
#   ansible-playbook playbooks/07_wem.yml -t upgrade            # 관련 RPM 을 repo 최신 버전으로 업그레이드
#   ansible-playbook playbooks/07_wem.yml -t liveplan           # WEM 1.6 이상: live query plan 구성 (WHPG 재시작 가능)
#
#   WEM 1.6 이상이면 기본 실행 / -t upgrade 에서도 live query plan 을 구성하며, 반영되지 않았으면 WHPG 를 재시작한다
#   (원치 않으면 -e wem_live_query_plan=false)
# ======================================================
- name: WEM 1.4 설치
  hosts: whpg_cluster
  become: true
  any_errors_fatal: true
  roles:
    - wem
