---
# ======================================================
# WarehousePG 전체 배포 메인 플레이북 (site.yml)
# 실행 순서: OS 구성 → WHPG 설치 → 초기화 → Extension → pgBouncer → HA → WEM → diskquota
# ======================================================

# Phase 1: OS 사전 구성 (모든 클러스터 노드)
- name: "Phase 1: OS 사전 구성"
  hosts: whpg_cluster
  become: true
  roles:
    - os_preconfig
  tags:
    - phase1
    - os

# Phase 2: WHPG RPM 설치 및 SSH 키 교환
- name: "Phase 2: WarehousePG 설치"
  hosts: whpg_cluster
  become: true
  roles:
    - whpg_install
  tags:
    - phase2
    - install

# Phase 3: 클러스터 초기화 (cluster → mirror → standby)
- name: "Phase 3: WarehousePG 클러스터 초기화"
  hosts: coordinator
  become: true
  roles:
    - whpg_init
  tags:
    - phase3
    - init

# Phase 4: Extension 설치 (기본 + 선택)
- name: "Phase 4: Extension 설치"
  hosts: whpg_cluster
  become: true
  roles:
    - whpg_extensions
  tags:
    - phase4
    - extensions

# Phase 5: pgBouncer (Coordinator)
- name: "Phase 5: pgBouncer 설치"
  hosts: pgbouncer_node
  become: true
  roles:
    - role: pgbouncer
      when: pgbouncer_enabled | default(true)
  tags:
    - phase5
    - pgbouncer

# Phase 6: Coordinator HA (keepalived VIP)
- name: "Phase 6: Coordinator HA 구성"
  hosts: coordinator:standby_coordinator
  become: true
  roles:
    - role: coordinator_ha
      when: coordinator_ha_enabled | default(false)
  tags:
    - phase6
    - ha

# Phase 7: WEM 1.4 (ClickHouse + Host Agent + otelcol)
# HA 이후에 실행: coordinator_ha_enabled 면 WEM 이 coordinator_vip 로 WHPG 에 접속 (wem_use_vip)
- name: "Phase 7: WEM 설치"
  hosts: whpg_cluster
  become: true
  any_errors_fatal: true
  roles:
    # wem role 에는 tags: [always] 태스크(점검 / Summary)가 있어 site.yml 을 다른 phase 태그로 실행해도 돌므로,
    # 태그 없이 전체 실행하거나 phase7 / wem 태그를 지정했을 때만 실행
    - role: wem
      when:
        - wem_enabled | default(true)
        - ansible_run_tags | intersect(['all', 'phase7', 'wem']) | length > 0
  tags:
    - phase7
    - wem

# Phase 8: cluster 차원 diskquota (post 작업, soft 90% / hard 92%)
- name: "Phase 8: diskquota 설정"
  hosts: whpg_cluster
  become: true
  any_errors_fatal: true
  roles:
    - role: whpg_diskquota
      when: whpg_diskquota_enabled | default(true) | bool
  tags:
    - phase8
    - diskquota
