---
# ======================================================
# WarehousePG Extension 업그레이드 플레이북
#
# 업그레이드 대상은 inventory/whpg_cluster.yml 의 whpg_extension_catalog 를 기준으로 결정됩니다.
#
# 사용법:
#   # 설치 플래그(install_*: true)가 켜진 모든 extension 업그레이드
#   ansible-playbook playbooks/upgrade/upgrade_extensions.yml \
#     -e "local_rpm_dir=/opt/whpg-rpms"
#
#   # 특정 extension만 업그레이드 (카탈로그 name 또는 패키지명)
#   ansible-playbook playbooks/upgrade/upgrade_extensions.yml \
#     -e "local_rpm_dir=/opt/whpg-rpms" \
#     -e "upgrade_target=pgaudit"
#
#   # 업그레이드 대상 목록 지정 (카탈로그 name 또는 패키지명 혼용 가능)
#   ansible-playbook playbooks/upgrade/upgrade_extensions.yml \
#     -e "local_rpm_dir=/opt/whpg-rpms" \
#     -e '{"upgrade_targets":["pgaudit","edb-whpg7-postgis"]}'
#
# 주의:
#   - WHPG를 정지하지 않고 RPM만 교체 후 ALTER EXTENSION UPDATE 실행
#   - shared_preload_libraries 변경이 필요한 경우 gpstop -ra 필요
# ======================================================

# -------- RPM 업그레이드 (모든 노드) --------
- name: "Extension Upgrade - 대상 목록 구성 및 업그레이드"
  hosts: whpg_cluster
  become: true
  vars:
    _targets: "{{ upgrade_targets | default([upgrade_target] if upgrade_target is defined else []) }}"
    _catalog_ids: >-
      {{ whpg_extension_catalog | map(attribute='name') | list
         + whpg_extension_catalog | map(attribute='pkg') | list }}
    # 대상 미지정: 활성화된 extension 전체 / 지정: name 또는 pkg 가 일치하는 항목
    _upgrade_exts: >-
      {{ whpg_extension_catalog | selectattr('enabled') | list
         if _targets | length == 0 else
         (whpg_extension_catalog | selectattr('name', 'in', _targets) | list
          + whpg_extension_catalog | selectattr('pkg', 'in', _targets) | list) | unique | list }}
  tasks:
    - name: 업그레이드 대상 패키지 목록 결정
      ansible.builtin.set_fact:
        # 카탈로그에 없는 이름은 패키지명으로 간주하여 그대로 업그레이드
        _upgrade_pkg_list: >-
          {{ (_upgrade_exts | map(attribute='pkg') | list
              + _targets | reject('in', _catalog_ids) | list) | unique | list }}

    - name: 업그레이드 대상 패키지 출력
      ansible.builtin.debug:
        msg: "업그레이드 대상: {{ _upgrade_pkg_list }}"
      run_once: true

    # 각 패키지: 로컬 RPM 우선, 없으면 dnf latest
    - name: 패키지별 로컬 RPM 탐색 및 업그레이드 (rpm_install role, state=latest)
      ansible.builtin.include_role:
        name: rpm_install
      vars:
        rpm_pkg_name: "{{ _pkg_name }}"
        rpm_install_state: latest
        rpm_ignore_dnf_errors: true     # 레포에 없는 패키지가 있어도 나머지는 계속 진행
      loop: "{{ _upgrade_pkg_list }}"
      loop_control:
        loop_var: _pkg_name

# -------- DB 내 extension 버전 갱신 (Coordinator) --------
- name: "Extension Upgrade - ALTER EXTENSION UPDATE (Coordinator)"
  hosts: coordinator
  become: true
  vars:
    _targets: "{{ upgrade_targets | default([upgrade_target] if upgrade_target is defined else []) }}"
    # CREATE EXTENSION 이 있는 항목(sql_ext)만 ALTER 대상
    _alter_exts: >-
      {{ (whpg_extension_catalog | selectattr('enabled') | list
          if _targets | length == 0 else
          (whpg_extension_catalog | selectattr('name', 'in', _targets) | list
           + whpg_extension_catalog | selectattr('pkg', 'in', _targets) | list) | unique | list)
         | selectattr('sql_ext', 'defined') | list }}
  tasks:
    - name: 업그레이드된 extension DB 내 버전 갱신 (ALTER EXTENSION UPDATE)
      ansible.builtin.shell:
        cmd: >
          source {{ whpg_install_dir }}/greenplum_path.sh &&
          psql -d {{ whpg_database }} -c
          "ALTER EXTENSION {{ item.sql_ext }} UPDATE;" 2>&1 || true
      become: true
      become_user: "{{ gpadmin_user }}"
      environment: "{{ whpg_env }}"
      loop: "{{ _alter_exts }}"
      loop_control:
        label: "{{ item.sql_ext }}"
      changed_when: true
      ignore_errors: true

    - name: Extension 버전 현황 확인
      ansible.builtin.shell:
        cmd: >
          source {{ whpg_install_dir }}/greenplum_path.sh &&
          psql -d {{ whpg_database }} -c
          "SELECT name, default_version, installed_version
           FROM pg_available_extensions
           WHERE installed_version IS NOT NULL
           ORDER BY name;" 2>&1
      become: true
      become_user: "{{ gpadmin_user }}"
      environment: "{{ whpg_env }}"
      register: ext_versions
      changed_when: false

    - name: Extension 버전 현황 출력
      ansible.builtin.debug:
        var: ext_versions.stdout_lines
