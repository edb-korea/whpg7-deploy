---
# upgrade_extensions.yml 에서 include_tasks로 호출
# loop_var: _pkg_name

- name: "{{ _pkg_name }} - 로컬 RPM 탐색"
  ansible.builtin.find:
    paths: "{{ local_rpm_dir | default('/opt/whpg-rpms') }}"
    patterns: "{{ _pkg_name }}*.rpm"
    recurse: false
  register: _single_rpm
  ignore_errors: true

- name: "{{ _pkg_name }} - 로컬 RPM으로 업그레이드"
  ansible.builtin.yum:
    name: "{{ _single_rpm.files | map(attribute='path') | sort | last }}"
    state: latest
    disable_gpg_check: "{{ rpm_disable_gpg_check | default(true) }}"
  when: _single_rpm.files | length > 0
  register: _single_local_result

- name: "{{ _pkg_name }} - dnf latest 업그레이드 (로컬 없을 때)"
  ansible.builtin.dnf:
    name: "{{ _pkg_name }}"
    state: latest
    disable_gpg_check: "{{ rpm_disable_gpg_check | default(true) }}"
  when: _single_rpm.files | length == 0
  register: _single_dnf_result
  ignore_errors: true

- name: "{{ _pkg_name }} - 업그레이드 결과"
  ansible.builtin.debug:
    msg: >
      [{{ _pkg_name }}]
      소스: {{ '로컬: ' + (_single_rpm.files | map(attribute='path') | sort | last | default(''))
               if _single_rpm.files | length > 0 else 'dnf' }}
      변경: {{ _single_local_result.changed | default(false) or
               _single_dnf_result.changed | default(false) }}
