---
# upgrade_extensions.yml 에서 include_tasks로 호출
# loop_var: _pkg_name
# Controller의 local_rpm_dir 에서 탐색 → 대상 노드 복사 → 설치

- name: "{{ _pkg_name }} - Controller 로컬 RPM 탐색"
  ansible.builtin.find:
    paths: "{{ local_rpm_dir | default('/opt/whpg-rpms') }}"
    patterns: "{{ _pkg_name }}*.rpm"
    recurse: false
  register: _single_rpm
  delegate_to: localhost
  become: false
  ignore_errors: true

- name: "{{ _pkg_name }} - 대상 노드 임시 디렉토리 생성"
  ansible.builtin.file:
    path: /tmp/whpg-rpms
    state: directory
    mode: '0755'
  when: _single_rpm.files | length > 0

- name: "{{ _pkg_name }} - Controller → 대상 노드 RPM 복사"
  ansible.builtin.copy:
    src: "{{ _single_rpm.files | map(attribute='path') | sort | last }}"
    dest: "/tmp/whpg-rpms/{{ _single_rpm.files | map(attribute='path') | sort | last | basename }}"
    mode: '0644'
  when: _single_rpm.files | length > 0

- name: "{{ _pkg_name }} - 로컬 RPM으로 업그레이드"
  ansible.builtin.yum:
    name: "/tmp/whpg-rpms/{{ _single_rpm.files | map(attribute='path') | sort | last | basename }}"
    state: latest
    disable_gpg_check: "{{ rpm_disable_gpg_check | default(true) }}"
  when: _single_rpm.files | length > 0
  register: _single_local_result

- name: "{{ _pkg_name }} - 임시 RPM 정리"
  ansible.builtin.file:
    path: "/tmp/whpg-rpms/{{ _single_rpm.files | map(attribute='path') | sort | last | basename }}"
    state: absent
  when: _single_rpm.files | length > 0

- name: "{{ _pkg_name }} - dnf latest 업그레이드 (로컬 없을 때)"
  ansible.builtin.dnf:
    name: "{{ _pkg_name }}"
    state: latest
    disable_gpg_check: "{{ rpm_disable_gpg_check | default(true) }}"
  when: _single_rpm.files | length == 0
  register: _single_dnf_result
  ignore_errors: true

- name: "{{ _pkg_name }} - 업그레이드 결과"
  ansible.builtin.debug:
    msg: >
      [{{ _pkg_name }}]
      소스: {{ '로컬: ' + (_single_rpm.files | map(attribute='path') | sort | last | basename | default(''))
               if _single_rpm.files | length > 0 else 'dnf' }}
      변경: {{ _single_local_result.changed | default(false) or
               _single_dnf_result.changed | default(false) }}
