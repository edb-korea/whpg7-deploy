---
# ======================================================
# WarehousePG Core 업그레이드 플레이북
#
# 사용법:
#   # local_rpm_dir 의 최신 버전으로 업그레이드 (없으면 dnf latest)
#   ansible-playbook playbooks/upgrade/upgrade_core.yml
#
#   # 특정 버전으로 업그레이드 (local_rpm_dir 에 여러 버전이 있을 때)
#   ansible-playbook playbooks/upgrade/upgrade_core.yml -e "whpg_upgrade_version=7.6.0"
#
#   ※ 업그레이드 후 inventory/whpg_cluster.yml 의 whpg_version 도 새 버전으로 맞춰 두세요.
#
# 업그레이드 절차:
#   1. 현재 버전 확인
#   2. 클러스터 정지 (gpstop)
#   3. 모든 노드에 새 RPM 설치 (upgrade)
#   4. 클러스터 시작 (gpstart)
#   5. 업그레이드 후 버전 확인
# ======================================================

# -------- Phase 1: 업그레이드 전 검증 --------
- name: "Core Upgrade - 사전 확인"
  hosts: coordinator
  become: true
  gather_facts: false
  tasks:
    - name: 현재 WHPG 버전 확인
      ansible.builtin.shell:
        cmd: >
          source {{ whpg_install_dir }}/greenplum_path.sh &&
          psql -d {{ whpg_database }} -t -c "SELECT version();" 2>&1
      become: true
      become_user: "{{ gpadmin_user }}"
      environment: "{{ whpg_env }}"
      register: current_version
      changed_when: false

    - name: 현재 버전 출력
      ansible.builtin.debug:
        msg: "현재 버전: {{ current_version.stdout | trim }}"

    - name: 클러스터 상태 확인
      ansible.builtin.shell:
        cmd: >
          source {{ whpg_install_dir }}/greenplum_path.sh &&
          gpstate -s 2>&1 | grep -E 'Up|Down|Status' | head -10
      become: true
      become_user: "{{ gpadmin_user }}"
      environment: "{{ whpg_env }}"
      register: cluster_state
      changed_when: false

    - name: 클러스터 상태 출력
      ansible.builtin.debug:
        var: cluster_state.stdout_lines

    - name: 업그레이드 대상 RPM 확인 (Controller 로컬)
      ansible.builtin.include_role:
        name: rpm_install
        tasks_from: select
      vars:
        rpm_pkg_name: "{{ whpg_core_pkg_name }}"
        rpm_pkg_version: "{{ whpg_upgrade_version | default('') }}"

    - name: 업그레이드 RPM 정보 출력
      ansible.builtin.debug:
        msg: >
          업그레이드 RPM:
          {{ _rpm_selected if _rpm_selected else '로컬 RPM 없음 → dnf 업그레이드 사용' }}

# -------- Phase 2: 클러스터 정지 --------
- name: "Core Upgrade - 클러스터 정지"
  hosts: coordinator
  become: true
  tasks:
    - name: gpstop (클러스터 정지)
      ansible.builtin.shell:
        cmd: >
          source {{ whpg_install_dir }}/greenplum_path.sh &&
          gpstop -af 2>&1
      become: true
      become_user: "{{ gpadmin_user }}"
      environment: "{{ whpg_env }}"
      changed_when: true

# -------- Phase 3: 모든 노드에 새 RPM 설치 --------
- name: "Core Upgrade - RPM 업그레이드 (모든 노드)"
  hosts: whpg_cluster
  become: true
  tasks:
    - name: Core RPM 업그레이드 (Controller 로컬 RPM 우선 → dnf fallback)
      ansible.builtin.include_role:
        name: rpm_install
      vars:
        rpm_pkg_name: "{{ whpg_core_pkg_name }}"
        rpm_pkg_version: "{{ whpg_upgrade_version | default('') }}"
        rpm_install_state: latest

    - name: 실제 설치 디렉토리 소유권 재정비
      ansible.builtin.file:
        path: "{{ whpg_real_install_dir }}"
        owner: "{{ gpadmin_user }}"
        group: "{{ gpadmin_group }}"
        recurse: true

    - name: "{{ whpg_install_dir }} symlink 재확인"
      ansible.builtin.file:
        src: "{{ whpg_real_install_dir }}"
        dest: "{{ whpg_install_dir }}"
        state: link
        owner: "{{ gpadmin_user }}"
        group: "{{ gpadmin_group }}"

# -------- Phase 4: 클러스터 재시작 및 검증 --------
- name: "Core Upgrade - 클러스터 재시작 및 검증"
  hosts: coordinator
  become: true
  tasks:
    - name: gpstart (클러스터 시작)
      ansible.builtin.shell:
        cmd: >
          source {{ whpg_install_dir }}/greenplum_path.sh &&
          gpstart -a 2>&1
      become: true
      become_user: "{{ gpadmin_user }}"
      environment: "{{ whpg_env }}"
      register: gpstart_result
      changed_when: true

    - name: 업그레이드 후 버전 확인
      ansible.builtin.shell:
        cmd: >
          source {{ whpg_install_dir }}/greenplum_path.sh &&
          psql -d {{ whpg_database }} -t -c "SELECT version();" 2>&1
      become: true
      become_user: "{{ gpadmin_user }}"
      environment: "{{ whpg_env }}"
      register: new_version
      changed_when: false

    - name: 업그레이드 결과 출력
      ansible.builtin.debug:
        msg: "업그레이드 완료. 새 버전: {{ new_version.stdout | trim }}"

    - name: gpstate로 세그먼트 상태 확인
      ansible.builtin.shell:
        cmd: >
          source {{ whpg_install_dir }}/greenplum_path.sh &&
          gpstate -s 2>&1 | tail -20
      become: true
      become_user: "{{ gpadmin_user }}"
      environment: "{{ whpg_env }}"
      register: post_state
      changed_when: false

    - name: 업그레이드 후 클러스터 상태
      ansible.builtin.debug:
        var: post_state.stdout_lines
