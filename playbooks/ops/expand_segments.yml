---
# ======================================================
# Segment 호스트 증설 (gpexpand)
#
# 준비:
#   1. 새 호스트를 inventory/hosts 의 [segments] 에 추가 (현재 클러스터에 없는 호스트 = 새 호스트, 위치 무관)
#      core / extension 은 inventory 의 whpg_version 이 아니라 기존 segment 호스트에 설치된 버전으로 설치
#      mirror 그룹 순서는 현재 클러스터(기존 호스트 content 순서) + 새 호스트([segments] 순서)
#      - 기존 2 / 3대: 합계 4대(whpg_mirror_group_size)까지 (2→3, 2→4, 3→4). 기존 mirror 를 새 구성에 맞게 재배치
#      - 기존 4대 이상: 4대 단위 (순서대로 4대씩 mirror 그룹이 된다)
#   2. 새 호스트에 root SSH 접속 가능, 데이터 디스크 구성(whpg_data_mounts)이 기존과 같아야 함
#
# 실행:
#   ansible-playbook playbooks/ops/expand_segments.yml                              # 추가 + 재분배 + 정리
#   ansible-playbook playbooks/ops/expand_segments.yml -e expand_redistribute=false # segment 추가까지만
#   ansible-playbook playbooks/ops/expand_segments.yml -e expand_duration=04:00:00  # 재분배 최대 4시간
#   (중간에 멈추거나 시간이 지나면 같은 명령을 다시 실행 → gpexpand.status 를 보고 이어서 진행)
#
# 순서:
#   1. 계획      : gp_segment_configuration 과 [segments] 비교 → 새 호스트 결정 / 조건 확인 / 기존 설치 버전 조회
#   2. /etc/hosts: 전체 노드에 새 호스트 등록
#   3. 새 호스트 : os_preconfig → (필요 시) 재부팅 → whpg_install → extension RPM
#                  → 전체 노드 gpadmin known_hosts 에 새 호스트 키 등록 (gpssh-exkeys 용)
#   4. gpexpand  : (기존 2 / 3대면) gpmovemirrors 로 기존 mirror 재배치
#                  → 새 primary + mirror 추가 (mirror 는 초기 구성과 같은 그룹 spread 규칙)
#                  → PXF 등록 → 테이블 재분배 → gpexpand 스키마 정리
#   5. WEM       : 새 호스트에 Host Agent / otelcol, pg_hba 갱신 (wem_enabled 일 때 07_wem.yml)
#
# 변수: roles/whpg_expand/defaults/main.yml
# ======================================================

- name: "증설 1/5: 계획"
  hosts: coordinator
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: 증설 계획
      ansible.builtin.include_role:
        name: whpg_expand
        tasks_from: plan.yml

- name: "증설 2/5: /etc/hosts 갱신 (전체 노드)"
  hosts: whpg_cluster
  become: true
  gather_facts: false
  tasks:
    - name: /etc/hosts 갱신
      ansible.builtin.include_role:
        name: os_preconfig
        tasks_from: hosts.yml

- name: "증설 3/5: 새 호스트 준비"
  hosts: expand_new_hosts
  become: true
  any_errors_fatal: true
  tasks:
    - name: 새 호스트 준비
      ansible.builtin.include_role:
        name: whpg_expand
        tasks_from: prepare.yml

# 기존 노드도 새 호스트 키를 알아야 gpssh-exkeys(StrictHostKeyChecking=yes)가 통과한다
# (새 호스트는 3/5 에서 gpadmin 이 만들어진 뒤라야 하므로 여기서 실행)
- name: "증설 3/5: 전체 노드 gpadmin known_hosts 에 새 호스트 키 등록"
  hosts: whpg_cluster
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: known_hosts 갱신
      ansible.builtin.include_role:
        name: os_preconfig
        tasks_from: known_hosts.yml
      when: hostvars[coordinator_host]._expand_new_hosts | default([]) | length > 0

- name: "증설 4/5: gpexpand (segment 추가 / 재분배)"
  hosts: coordinator
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: gpexpand
      ansible.builtin.include_role:
        name: whpg_expand

- name: "증설 5/5: WEM (새 호스트 Host Agent / otelcol, pg_hba)"
  ansible.builtin.import_playbook: ../07_wem.yml
  when:
    - wem_enabled | default(true) | bool
    - hostvars[coordinator_host]._expand_new_hosts | default([]) | length > 0
