---
# ======================================================
# WHPG 클러스터 상태 확인 플레이북
# 사용: ansible-playbook playbooks/ops/status.yml
# ======================================================

- name: WarehousePG 클러스터 상태 확인
  hosts: coordinator
  become: true
  tasks:
    - name: gpstate 전체 상태 확인
      ansible.builtin.shell:
        cmd: >
          source {{ whpg_install_dir }}/greenplum_path.sh &&
          gpstate -s 2>&1
      become: true
      become_user: "{{ gpadmin_user }}"
      environment: "{{ whpg_env }}"
      register: gpstate_result
      changed_when: false

    - name: 클러스터 상태 출력
      ansible.builtin.debug:
        var: gpstate_result.stdout_lines

    - name: pgBouncer 연결 상태 확인
      ansible.builtin.shell:
        cmd: psql -h 127.0.0.1 -p {{ pgbouncer_listen_port }} -U {{ gpadmin_user }} pgbouncer -c "SHOW POOLS;" 2>&1
      become: true
      become_user: "{{ gpadmin_user }}"
      environment: "{{ whpg_env }}"
      register: pgbouncer_status
      changed_when: false
      ignore_errors: true

    - name: pgBouncer 상태 출력
      ansible.builtin.debug:
        var: pgbouncer_status.stdout_lines

    - name: Standby Coordinator 동기화 상태
      ansible.builtin.shell:
        cmd: >
          source {{ whpg_install_dir }}/greenplum_path.sh &&
          gpinitstandby -s {{ standby_coordinator_host }} -v 2>&1
      become: true
      become_user: "{{ gpadmin_user }}"
      environment: "{{ whpg_env }}"
      register: standby_sync
      changed_when: false
      ignore_errors: true

    - name: Standby 동기화 상태 출력
      ansible.builtin.debug:
        var: standby_sync.stdout_lines
