---
# ======================================================
# WEM 1.4 삭제 (확인 질문 없이 바로 삭제)
#
#   ansible-playbook playbooks/ops/remove_wem.yml
#
# 삭제: WEM, ClickHouse, (설치한 경우) WEM 상태 DB, Host Agent, otelcol 과 설정 / 데이터,
#       pg_hba.conf 의 WEM 블록, WHPG 의 wem DB / wemon 계정 / wem_group resource group
# 조건: WEM host 의 whpg-enterprise-manager 가 wem_remove_min_version(기본 1.4) 이상일 때만 삭제.
#       rpm 이 없거나 그보다 낮으면(1.2/1.3) 아무것도 지우지 않고 끝난다
# 보존: WHPG 본체, postgres / template0 / template1 / gpadmin / whpg_database (wem_protected_databases)
# 변수: roles/wem/defaults/main.yml 의 "WEM 1.4 삭제" 구역
# ======================================================
- name: WEM 1.4 삭제
  hosts: whpg_cluster
  become: true
  any_errors_fatal: true
  tasks:
    - name: Pre-checks and placement
      ansible.builtin.import_role:
        name: wem
        tasks_from: 00-checks.yml
      tags: [always]

    - name: Remove WEM 1.4
      ansible.builtin.import_role:
        name: wem
        tasks_from: remove-wem14.yml
      tags: [remove]
