---
# coordinator_ha role 기본값
# VIP/인터페이스/인증 비밀번호는 inventory/whpg_cluster.yml 참고

# failover 스크립트 / 로그 위치
ha_script_dir: /opt/whpg_ha
ha_log_dir: /var/log

# 헬스체크 접속 호스트
ha_healthcheck_host: "127.0.0.1"

# keepalived VRRP 설정
keepalived_conf_file: /etc/keepalived/keepalived.conf
keepalived_virtual_router_id: 51
keepalived_master_priority: 110
keepalived_backup_priority: 90
keepalived_advert_int: 1
keepalived_check_interval: 5
keepalived_check_weight: -20
keepalived_check_fall: 2
keepalived_check_rise: 2
