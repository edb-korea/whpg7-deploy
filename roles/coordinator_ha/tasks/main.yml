---
# ======================================================
# Role: coordinator_ha
# Coordinator HA (keepalived + VIP) 구성
# 참고: https://github.com/unixfree/whpg_coordinator_ha_v2
# ======================================================

# ---------- 1. keepalived 설치 ----------
- name: keepalived 설치
  ansible.builtin.package:
    name: keepalived
    state: present
  when: coordinator_ha_method == "keepalived"

# ---------- 2. whpg failover 스크립트 배포 ----------
- name: failover 스크립트 디렉토리 생성
  ansible.builtin.file:
    path: /opt/whpg_ha
    state: directory
    owner: "{{ gpadmin_user }}"
    group: "{{ gpadmin_group }}"
    mode: '0755'

- name: keepalived WHPG 헬스체크 스크립트 배포
  ansible.builtin.template:
    src: whpg_healthcheck.sh.j2
    dest: /opt/whpg_ha/whpg_healthcheck.sh
    owner: "{{ gpadmin_user }}"
    group: "{{ gpadmin_group }}"
    mode: '0755'

- name: keepalived MASTER 승격 스크립트 배포 (gpinitstandby -n)
  ansible.builtin.template:
    src: whpg_promote.sh.j2
    dest: /opt/whpg_ha/whpg_promote.sh
    owner: "{{ gpadmin_user }}"
    group: "{{ gpadmin_group }}"
    mode: '0755'

- name: keepalived FAULT 처리 스크립트 배포
  ansible.builtin.template:
    src: whpg_demote.sh.j2
    dest: /opt/whpg_ha/whpg_demote.sh
    owner: "{{ gpadmin_user }}"
    group: "{{ gpadmin_group }}"
    mode: '0755'

# ---------- 3. keepalived.conf 배포 ----------
- name: keepalived.conf 배포 (Coordinator - MASTER)
  ansible.builtin.template:
    src: keepalived-master.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: '0644'
  when: inventory_hostname in groups['coordinator']
  notify: restart_keepalived

- name: keepalived.conf 배포 (Standby - BACKUP)
  ansible.builtin.template:
    src: keepalived-backup.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: '0644'
  when: inventory_hostname in groups['standby_coordinator']
  notify: restart_keepalived

# ---------- 4. keepalived 서비스 시작 ----------
- name: keepalived 서비스 활성화 및 시작
  ansible.builtin.systemd:
    name: keepalived
    state: started
    enabled: true
  when:
    - coordinator_ha_method == "keepalived"
    - inventory_hostname in groups['coordinator'] or inventory_hostname in groups['standby_coordinator']

# ---------- 5. ip_nonlocal_bind 설정 (VIP 바인딩 허용) ----------
- name: ip_nonlocal_bind 설정
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: "1"
    state: present
    sysctl_file: /etc/sysctl.d/95-whpg.conf
    reload: true
  when:
    - inventory_hostname in groups['coordinator'] or inventory_hostname in groups['standby_coordinator']

# ---------- 6. VIP 동작 확인 ----------
- name: keepalived 상태 확인
  ansible.builtin.command:
    cmd: systemctl status keepalived
  register: keepalived_status
  changed_when: false
  failed_when: false
  when:
    - coordinator_ha_method == "keepalived"
    - inventory_hostname in groups['coordinator'] or inventory_hostname in groups['standby_coordinator']

- name: keepalived 상태 출력
  ansible.builtin.debug:
    var: keepalived_status.stdout_lines
  when:
    - keepalived_status is defined
    - inventory_hostname in groups['coordinator'] or inventory_hostname in groups['standby_coordinator']

- name: VIP 인터페이스 확인 (Coordinator에서 VIP 보유 여부)
  ansible.builtin.command:
    cmd: "ip addr show {{ coordinator_vip_interface }}"
  register: vip_check
  changed_when: false
  failed_when: false
  when: inventory_hostname in groups['coordinator']

- name: VIP 상태 출력
  ansible.builtin.debug:
    msg: "VIP {{ coordinator_vip }} 보유 여부: {{ 'YES' if coordinator_vip in vip_check.stdout else 'NO (BACKUP 상태이거나 keepalived 시작 중)' }}"
  when:
    - vip_check is defined
    - inventory_hostname in groups['coordinator']

