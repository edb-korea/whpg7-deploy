---
# ======================================================
# Role: whpg_extensions
# 기본 + Optional Extension 설치
# rpm_install role을 통해: 로컬 RPM 우선 → dnf fallback
# ======================================================

# ----------------------------------------
# shared_preload_libraries 목록 동적 구성
# ----------------------------------------
- name: shared_preload_libraries 목록 초기화
  ansible.builtin.set_fact:
    whpg_preload_libs: []
  when: inventory_hostname == coordinator_host

- name: pgaudit → preload 목록 추가
  ansible.builtin.set_fact:
    whpg_preload_libs: "{{ whpg_preload_libs + ['pgaudit'] }}"
  when: install_pgaudit and inventory_hostname == coordinator_host

- name: diskquota → preload 목록 추가
  ansible.builtin.set_fact:
    whpg_preload_libs: "{{ whpg_preload_libs + ['diskquota'] }}"
  when: install_diskquota and inventory_hostname == coordinator_host

- name: user_profile → preload 목록 추가
  ansible.builtin.set_fact:
    whpg_preload_libs: "{{ whpg_preload_libs + ['user_profile'] }}"
  when: install_user_profile and inventory_hostname == coordinator_host

# ==========================================
# 기본 Extension (항상 설치)
# ==========================================

# --- PXF ---
- name: PXF 설치 (edb-whpg7-pxf)
  ansible.builtin.include_role:
    name: rpm_install
  vars:
    rpm_pkg_name: "edb-whpg7-pxf"
  when: install_pxf

- name: PXF 클러스터 초기화
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      pxf cluster init 2>&1
  become: true
  become_user: "{{ gpadmin_user }}"
  when: install_pxf and inventory_hostname == coordinator_host
  changed_when: true

- name: PXF Hadoop core-site.xml 설정
  ansible.builtin.template:
    src: pxf-core-site.xml.j2
    dest: "{{ gpadmin_home }}/pxf/conf/core-site.xml"
    owner: "{{ gpadmin_user }}"
    group: "{{ gpadmin_group }}"
    mode: '0644'
  when: install_pxf and pxf_hadoop_enabled and inventory_hostname == coordinator_host

- name: PXF 클러스터 시작
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      pxf cluster start 2>&1
  become: true
  become_user: "{{ gpadmin_user }}"
  when: install_pxf and inventory_hostname == coordinator_host
  changed_when: true

# --- pgaudit ---
- name: pgaudit 설치 (edb-whpg7-pgaudit)
  ansible.builtin.include_role:
    name: rpm_install
  vars:
    rpm_pkg_name: "edb-whpg7-pgaudit"
  when: install_pgaudit

- name: pgaudit CREATE EXTENSION
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      psql -d gpadmin -c "CREATE EXTENSION IF NOT EXISTS pgaudit;" 2>&1
  become: true
  become_user: "{{ gpadmin_user }}"
  when: install_pgaudit and inventory_hostname == coordinator_host
  changed_when: true

