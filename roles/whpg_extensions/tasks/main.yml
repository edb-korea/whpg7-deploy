# --- MADlib ---
- name: MADlib 설치 (edb-whpg7-madlib)
  ansible.builtin.include_role:
    name: rpm_install
  vars:
    rpm_pkg_name: "edb-whpg7-madlib"
  when: install_madlib

- name: MADlib 설치 스크립트 실행
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      $GPHOME/madlib/bin/madpack -s madlib install
      -p warehousepg -c gpadmin@localhost:5432/gpadmin 2>&1
  become: true
  become_user: "{{ gpadmin_user }}"
  when: install_madlib and inventory_hostname == coordinator_host
  changed_when: true
  ignore_errors: true

