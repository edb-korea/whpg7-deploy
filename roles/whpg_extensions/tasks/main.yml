# --- shared_preload_libraries 한 번에 gpconfig 적용 ---
- name: shared_preload_libraries 통합 설정
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      gpconfig -c shared_preload_libraries -v '{{ whpg_preload_libs | join(",") }}' 2>&1
  become: true
  become_user: "{{ gpadmin_user }}"
  environment:
    COORDINATOR_DATA_DIRECTORY: "{{ coordinator_data_dir }}"
  when:
    - inventory_hostname == coordinator_host
    - whpg_preload_libs | length > 0
  changed_when: true

