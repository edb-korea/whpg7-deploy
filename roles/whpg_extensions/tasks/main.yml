# --- MADlib ---
- name: MADlib 설치 (모든 노드)
  ansible.builtin.package:
    name: warehousepg-madlib
    state: present
  when: install_madlib

- name: MADlib 설치 스크립트 실행 (Coordinator)
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      $GPHOME/madlib/bin/madpack -s madlib install -p warehousepg -c gpadmin@localhost:5432/gpadmin 2>&1
  become: true
  become_user: "{{ gpadmin_user }}"
  when:
    - install_madlib
    - inventory_hostname == coordinator_host
  changed_when: true
  ignore_errors: true

