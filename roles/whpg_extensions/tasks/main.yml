---
# ======================================================
# Role: whpg_extensions
# 기본 Extension + Optional Extension 설치
# ======================================================

# ----------------------------------------
# 공통 helper macro: gpconfig enable
# ----------------------------------------
- name: WHPG 클러스터 기동 확인
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      gpstate -s 2>&1 | grep -c 'Up' || true
  become: true
  become_user: "{{ gpadmin_user }}"
  environment:
    COORDINATOR_DATA_DIRECTORY: "{{ coordinator_data_dir }}"
  when: inventory_hostname == coordinator_host
  changed_when: false
  register: gpstate_check

# ==========================================
# 기본 Extension (항상 설치)
# ==========================================

# --- PXF (Hadoop/HDFS 연동) ---
- name: PXF RPM 설치 (모든 노드)
  ansible.builtin.package:
    name: pxf
    state: present
  when: install_pxf

- name: PXF 환경 초기화 (Coordinator에서)
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      pxf cluster init 2>&1
  become: true
  become_user: "{{ gpadmin_user }}"
  when:
    - install_pxf
    - inventory_hostname == coordinator_host
  changed_when: true

- name: PXF Hadoop core-site.xml 설정
  ansible.builtin.template:
    src: pxf-core-site.xml.j2
    dest: "{{ gpadmin_home }}/pxf/conf/core-site.xml"
    owner: "{{ gpadmin_user }}"
    group: "{{ gpadmin_group }}"
    mode: '0644'
  when:
    - install_pxf
    - pxf_hadoop_enabled
    - inventory_hostname == coordinator_host

- name: PXF 클러스터 시작
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      pxf cluster start 2>&1
  become: true
  become_user: "{{ gpadmin_user }}"
  when:
    - install_pxf
    - inventory_hostname == coordinator_host
  changed_when: true

# --- shared_preload_libraries 목록 동적 구성 ---
# 활성화된 라이브러리를 하나씩 추가하는 대신 목록을 조립 후 한 번에 gpconfig

- name: shared_preload_libraries 목록 초기화
  ansible.builtin.set_fact:
    whpg_preload_libs: []
  when: inventory_hostname == coordinator_host

- name: pgaudit을 preload 목록에 추가
  ansible.builtin.set_fact:
    whpg_preload_libs: "{{ whpg_preload_libs + ['pgaudit'] }}"
  when:
    - install_pgaudit
    - inventory_hostname == coordinator_host

- name: diskquota를 preload 목록에 추가
  ansible.builtin.set_fact:
    whpg_preload_libs: "{{ whpg_preload_libs + ['diskquota'] }}"
  when:
    - install_diskquota
    - inventory_hostname == coordinator_host

- name: user_profile을 preload 목록에 추가
  ansible.builtin.set_fact:
    whpg_preload_libs: "{{ whpg_preload_libs + ['user_profile'] }}"
  when:
    - install_user_profile
    - inventory_hostname == coordinator_host

# --- pgaudit ---
- name: pgaudit 설치 (모든 노드)
  ansible.builtin.package:
    name: warehousepg-pgaudit
    state: present
  when: install_pgaudit

- name: pgaudit CREATE EXTENSION (DB 내 등록)
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      psql -d gpadmin -c "CREATE EXTENSION IF NOT EXISTS pgaudit;" 2>&1
  become: true
  become_user: "{{ gpadmin_user }}"
  when:
    - install_pgaudit
    - inventory_hostname == coordinator_host
  changed_when: true

