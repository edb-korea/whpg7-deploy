---
# WEM 1.4 설치와 wem.conf (WEM host)
# tag: wem
- name: Install and configure WEM 1.4
  when: inventory_hostname == wem_host
  block:
    - name: Check installed WEM package version
      ansible.builtin.command: rpm -q --qf '%{VERSION}' {{ wem_pkg_name }}
      register: _wem_installed_ver
      changed_when: false
      failed_when: false
      check_mode: false

    # Controller 의 local_rpm_dir 우선 → dnf fallback. wem_version 과 일치하는 RPM 만 사용
    # -t upgrade 로 더 높은 버전이 설치되어 있으면 wem_version 으로 내리지 않는다
    - name: Install WEM 1.4 package
      ansible.builtin.include_role:
        name: rpm_install
      vars:
        rpm_pkg_name: "{{ wem_pkg_name }}"
        rpm_pkg_version: "{{ wem_version }}"
      when: >-
        _wem_installed_ver.rc != 0
        or not (_wem_installed_ver.stdout | trim) is version(wem_version, '>=')

    - name: Remember whether the WEM package changed
      ansible.builtin.set_fact:
        _wem_pkg_changed: "{{ (_rpm_local_install.changed | default(false)) or (_rpm_dnf_install.changed | default(false)) }}"
      # 설치를 건너뛰었으면 앞 단계(ClickHouse 등)의 rpm_install 결과가 남아 있으므로 보지 않는다
      when: _wem_installed_ver.rc != 0 or not (_wem_installed_ver.stdout | trim) is version(wem_version, '>=')

    # WEM 버전마다 설정 파일 위치 / 실행 계정이 다르다 (1.4: /etc/wem/wem.conf, 1.5: /etc/edb/wem/wem.conf + User=wem)
    # wem.service 의 EnvironmentFile / Group 을 따른다 (서비스가 아직 없으면 wem_config_file / wem_unix_group)
    # 다른 경로에 쓰면 WEM 은 기존 secret 을 계속 쓰고 Host Agent 에는 새 join-token 이 들어가 새 agent 가 pending 으로 남는다
    - name: wem.service 의 설정 파일 / 그룹 조회
      ansible.builtin.shell:
        cmd: |
          systemctl show wem -p EnvironmentFiles --value 2>/dev/null | awk 'NR == 1 {print $1}' | sed 's/^-//'
          echo "|$(systemctl show wem -p Group --value 2>/dev/null)"
      register: _wem_unit
      changed_when: false
      check_mode: false

    - name: wem.conf 경로 / 그룹 결정
      ansible.builtin.set_fact:
        _wem_conf_path: "{{ (_wem_unit.stdout_lines | reject('match', '^\\|') | first | default('')) or wem_config_file }}"
        _wem_conf_group: "{{ (_wem_unit.stdout_lines | select('match', '^\\|') | first | default('|'))[1:] or wem_unix_group }}"

    - name: 현재 wem.conf 소유자 확인
      ansible.builtin.stat:
        path: "{{ _wem_conf_path }}"
      register: _wem_conf_stat

    # 다시 실행할 때는 기존 wem.conf 의 secret 을 그대로 쓴다.
    # (새로 만들면 WEM 재시작 + 모든 Host Agent 의 join-token 교체가 필요해진다)
    # 업그레이드로 경로가 바뀌어 새 경로에 아직 없으면 이전 경로(wem_config_file)의 secret 을 이어 쓴다
    - name: Read existing wem.conf
      ansible.builtin.slurp:
        src: "{{ _wem_conf_path if _wem_conf_stat.stat.exists else wem_config_file }}"
      register: _wem_conf_old
      failed_when: false
      no_log: true

    - name: Generate WEM_COOKIE_SECRET / WEM_AGENT_JOIN_SECRET (없을 때만)
      ansible.builtin.command: openssl rand -hex 32
      register: _new_secret
      loop: [cookie, join]
      changed_when: false
      check_mode: false
      no_log: true

    # Host Agent 자동 승인용 공유 비밀(join secret)은 07-host-agent 에서 join-token 으로 쓴다
    - name: Keep secrets as facts
      ansible.builtin.set_fact:
        wem_cookie_secret_value: "{{ _old.WEM_COOKIE_SECRET | default(_new_secret.results[0].stdout | trim, true) }}"
        wem_join_secret_value: "{{ _old.WEM_AGENT_JOIN_SECRET | default(_new_secret.results[1].stdout | trim, true) }}"
      vars:
        _old_text: "{{ (_wem_conf_old.content | b64decode) if _wem_conf_old.content is defined else '' }}"
        _old:
          WEM_COOKIE_SECRET: "{{ _old_text | regex_search(\"(?m)^WEM_COOKIE_SECRET='?([0-9a-f]+)'?$\", '\\1') | default([''], true) | first }}"
          WEM_AGENT_JOIN_SECRET: "{{ _old_text | regex_search(\"(?m)^WEM_AGENT_JOIN_SECRET='?([0-9a-f]+)'?$\", '\\1') | default([''], true) | first }}"
      no_log: true

    - name: Write wem.conf ({{ _wem_conf_path }})
      ansible.builtin.template:
        src: wem.conf.j2
        dest: "{{ _wem_conf_path }}"
        # 기존 파일의 소유자를 유지 (1.5 패키지는 wem:wem) → 소유자 차이만으로 WEM 이 재시작되지 않게
        owner: "{{ _wem_conf_stat.stat.pw_name | default('root') }}"
        group: "{{ _wem_conf_group }}"
        mode: "0640"
      register: _wem_conf
      no_log: true

    - name: Open WEM / ClickHouse ports in firewalld (실행 중인 경우만)
      ansible.builtin.shell:
        cmd: |
          if systemctl is-active --quiet firewalld; then
            for p in {{ wem_port }} {{ wem_agent_port }} {{ clickhouse_native_port }}; do
              firewall-cmd --permanent --add-port=${p}/tcp
            done
            firewall-cmd --reload
            echo opened
          fi
        executable: /bin/bash
      register: _fw
      changed_when: "'opened' in _fw.stdout"
      when: wem_manage_firewall | bool

    # --check 에서 패키지가 아직 설치되지 않았으면(설치 예정) 서비스 기동 / 확인은 건너뛴다
    - name: Start and verify WEM
      when: not (ansible_check_mode and _wem_installed_ver.rc != 0)
      block:
        # 패키지나 wem.conf 가 바뀐 경우에만 재시작 (처음 시작 시 WEM 이 상태 DB 를 setup)
        - name: Enable and start WEM
          ansible.builtin.systemd:
            name: wem
            enabled: true
            state: "{{ 'restarted' if (_wem_conf is changed or _wem_pkg_changed | default(false) | bool) else 'started' }}"
            daemon_reload: true

        - name: Wait for WEM web / agent relay ports
          ansible.builtin.wait_for:
            host: "{{ wem_host_ip }}"
            port: "{{ item }}"
            timeout: 180
          loop:
            - "{{ wem_port }}"
            - "{{ wem_agent_port }}"
