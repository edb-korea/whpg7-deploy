---
# ClickHouse Coordinator Query Logs 객체 (WEM host)
# tag: querylogs
- name: Create Coordinator Query Logs objects in ClickHouse
  when:
    - inventory_hostname == wem_host
    - coordinator_query_logs_enabled | bool
  vars:
    _ch_client: "{{ ['clickhouse-client', '--host', wem_host_ip, '--user', clickhouse_user, '--password', clickhouse_password] }}"
    _query_logs_steps: >-
      {{ ([{'name': 'drop existing objects', 'sql': lookup('ansible.builtin.file', 'query_logs_drop.sql')}] if (coordinator_query_logs_recreate | bool) else [])
         + [{'name': 'states table', 'sql': lookup('ansible.builtin.file', 'query_logs_states.sql') | replace('__TTL_DAYS__', coordinator_query_logs_ttl_days | string)}]
         + [{'name': 'materialized view', 'sql': lookup('ansible.builtin.file', 'query_logs_mv.sql') | replace('__WEM_USER__', wem_whpg_user)},
            {'name': 'query view', 'sql': lookup('ansible.builtin.file', 'query_logs_view.sql')}] }}
  block:
    - name: Wait for acp_observability.otel_logs table
      ansible.builtin.command:
        argv: "{{ _ch_client + ['--query', 'EXISTS TABLE acp_observability.otel_logs'] }}"
      register: _otel_logs_table
      until: (_otel_logs_table.stdout | default('') | trim) == '1'
      retries: "{{ ((coordinator_query_logs_wait_seconds | int) / 10) | round(0, 'ceil') | int }}"
      delay: 10
      changed_when: false
      ignore_errors: true
      no_log: true

    - name: Warn when otel_logs table does not exist yet
      ansible.builtin.debug:
        msg: "acp_observability.otel_logs 테이블이 아직 없어 Coordinator Query Logs 객체를 만들지 못했습니다. Host Agent 승인과 로그 수집 시작 후 -t querylogs 로 다시 실행하세요."
      when: (_otel_logs_table.stdout | default('') | trim) != '1'

    - name: Apply Coordinator Query Logs SQL
      ansible.builtin.command:
        argv: "{{ _ch_client + ['--multiquery'] }}"
        stdin: "{{ item.sql }}"
      loop: "{{ _query_logs_steps }}"
      loop_control:
        label: "{{ item.name }}"
      register: _ql_apply
      changed_when: true
      failed_when: false
      no_log: true
      when: (_otel_logs_table.stdout | default('') | trim) == '1'

    - name: Fail when any Coordinator Query Logs SQL failed
      ansible.builtin.fail:
        msg: "{{ _ql_apply.results | rejectattr('rc', 'equalto', 0) | map(attribute='item.name') | list }} 실패: {{ _ql_apply.results | rejectattr('rc', 'equalto', 0) | map(attribute='stderr') | list }}"
      when:
        - _ql_apply is not skipped
        - _ql_apply.results | rejectattr('rc', 'equalto', 0) | list | length > 0
