---
# WEM 1.4 구성 (WEM 1.2 가 있으면 먼저 삭제). playbooks/07_wem.yml, site.yml Phase 5 가 실행한다.
# 단계별 tag 로 일부만 실행할 수 있다 (예: -t tune). 자세한 내용은 README.md 의 WEM 절을 참고한다.
# 참고: https://github.com/edb-korea/wem_ansible

# 실행 전 확인 (OS, VIP 활성 여부, wem_use_vip 조건, 배치 출력)
- name: "00-checks"
  ansible.builtin.import_tasks: 00-checks.yml
  tags: [always]

# WEM 1.2 삭제 (Prometheus / Loki / Alertmanager / Alloy / collector) - 1.2 가 감지된 경우만
- name: "01-cleanup-wem12"
  ansible.builtin.import_tasks: 01-cleanup-wem12.yml
  tags: [cleanup]

# WHPG pg_hba.conf 에 WEM 계정(wem_whpg_user) 접속 허용
- name: "03-pg-hba"
  ansible.builtin.import_tasks: 03-pg-hba.yml
  tags: [pghba]

# ClickHouse 설치 (WEM host)
- name: "04-clickhouse"
  ansible.builtin.import_tasks: 04-clickhouse.yml
  tags: [clickhouse]

# WEM 접속 계정 / DB / resource group (coordinator), (선택) 별도 상태 DB (WEM host)
- name: "05-state-database"
  ansible.builtin.import_tasks: 05-state-database.yml
  tags: [statedb]

# WEM 1.4 설치와 wem.conf (WEM host)
- name: "06-wem"
  ansible.builtin.import_tasks: 06-wem.yml
  tags: [wem]

# Host Agent + otelcol 설치, join-token 선등록 (전 노드)
- name: "07-host-agent"
  ansible.builtin.import_tasks: 07-host-agent.yml
  tags: [agent]

# otelcol 설정 조정 (CPU 절감, DB 메트릭 수집 위치)
- name: "08-otelcol-tune"
  ansible.builtin.import_tasks: 08-otelcol-tune.yml
  tags: [tune]

# ClickHouse Coordinator Query Logs 객체 (WEM host)
- name: "09-query-logs"
  ansible.builtin.import_tasks: 09-query-logs.yml
  tags: [querylogs]

# 서비스 상태 확인
- name: "10-summary"
  ansible.builtin.import_tasks: 10-summary.yml
  tags: [always]
