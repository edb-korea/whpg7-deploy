---
# WEM 1.2/1.3 삭제 (Prometheus / Loki / Alertmanager / Alloy / collector)
# tag: cleanup
#
# wem_cleanup_legacy=auto(기본): 1.2/1.3 구성요소가 설치되어 있을 때만 실행한다.
#   cleanup_packages 중 whpg-enterprise-manager 외의 패키지가 하나라도 있거나,
#   whpg-enterprise-manager 가 wem_remove_min_version(1.4) 보다 낮은 버전이면 1.2/1.3 이 있는 것으로 본다.
#   (그래서 1.4 설치 또는 -t upgrade 후 site.yml 을 다시 실행해도 1.4 이상의 WEM / 상태 DB 를 지우지 않는다)

- name: Detect WEM 1.2/1.3 components
  ansible.builtin.shell:
    cmd: |
      for p in {{ cleanup_packages | reject('equalto', wem_pkg_name) | join(' ') }}; do
        rpm -q "$p" >/dev/null 2>&1 && echo "legacy: $p"
      done
      v=$(rpm -q --qf '%{VERSION}' {{ wem_pkg_name }} 2>/dev/null) && \
        [ "$(printf '%s\n' "$v" "{{ wem_remove_min_version }}" | sort -V | head -n 1)" != "{{ wem_remove_min_version }}" ] && \
        echo "legacy: {{ wem_pkg_name }} $v"
      true
    executable: /bin/bash
  register: _wem_legacy_detect
  changed_when: false
  check_mode: false

- name: Decide whether to remove WEM 1.2/1.3
  ansible.builtin.set_fact:
    _wem_cleanup: >-
      {{ wem_cleanup_legacy == 'always'
         or (wem_cleanup_legacy == 'auto'
             and (groups['whpg_cluster'] | map('extract', hostvars, ['_wem_legacy_detect', 'stdout'])
                  | select | list | length > 0)) }}

- name: Show WEM 1.2/1.3 detection result
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: {{ _wem_legacy_detect.stdout_lines | default([]) or ['WEM 1.2/1.3 구성요소 없음'] }}
      → 1.2/1.3 삭제 {{ '실행' if _wem_cleanup | bool else '건너뜀' }} (wem_cleanup_legacy={{ wem_cleanup_legacy }})

- name: Remove WEM 1.2/1.3
  when: _wem_cleanup | bool
  block:
    - name: Stop and disable WEM related services (없는 서비스는 건너뜀)
      ansible.builtin.shell:
        cmd: |
          for s in {{ cleanup_services | join(' ') }}; do
            if systemctl list-unit-files "$s.service" 2>/dev/null | grep -q "^$s.service"; then
              systemctl disable --now "$s" && echo "stopped: $s"
            fi
          done
        executable: /bin/bash
      register: _stop_services
      changed_when: _stop_services.stdout | length > 0

    - name: Remove WEM 1.2/1.3 / observability packages
      ansible.builtin.dnf:
        name: "{{ cleanup_packages }}"
        state: absent

    - name: Remove Alloy / collector files (all hosts)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ cleanup_paths_all_hosts }}"

    - name: Remove WEM host files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ cleanup_paths_wem_host }}"
      when: inventory_hostname == wem_host

    - name: Remove observability system users
      ansible.builtin.user:
        name: "{{ item }}"
        state: absent
      loop: "{{ cleanup_users }}"
      when: inventory_hostname == wem_host

    - name: Reload systemd after cleanup
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Drop WEM 1.2/1.3 state database in WHPG
      ansible.builtin.shell:
        cmd: |
          source {{ whpg_install_dir }}/greenplum_path.sh
          export PGPORT={{ whpg_coordinator_port }}
          psql -d postgres -c "DROP DATABASE IF EXISTS {{ wem_state_database }};"
        executable: /bin/bash
      become_user: "{{ gpadmin_user }}"
      environment: "{{ whpg_env }}"
      register: _drop_old_state
      changed_when: "'DROP' in _drop_old_state.stdout"
      failed_when: false
      when:
        - inventory_hostname == coordinator_host
        - wem_drop_old_state_db_in_whpg | bool
        - wem_state_database not in wem_protected_databases

    - name: Show result of dropping old WEM state database
      ansible.builtin.debug:
        msg: "{{ (_drop_old_state.stdout_lines | default([])) + (_drop_old_state.stderr_lines | default([])) }}"
      when:
        - inventory_hostname == coordinator_host
        - _drop_old_state is not skipped
