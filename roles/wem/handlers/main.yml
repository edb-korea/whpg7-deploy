---
- name: restart_prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: restarted
    daemon_reload: true

- name: restart_loki
  ansible.builtin.systemd:
    name: loki
    state: restarted
    daemon_reload: true

- name: restart_grafana
  ansible.builtin.systemd:
    name: grafana-server
    state: restarted

- name: restart_postgres_exporter
  ansible.builtin.systemd:
    name: postgres_exporter
    state: restarted
    daemon_reload: true

- name: restart_promtail
  ansible.builtin.systemd:
    name: promtail
    state: restarted
    daemon_reload: true
