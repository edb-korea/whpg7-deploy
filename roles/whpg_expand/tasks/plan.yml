---
# ======================================================
# 증설 계획 (coordinator 에서 실행)
#   - gp_segment_configuration 과 inventory [segments] 를 비교해 새 호스트를 찾는다
#   - 새 호스트는 [segments] 끝에 추가되어 있어야 한다
#       기존 2 / 3대 : 4대(whpg_mirror_group_size)까지만 증설 (2→3, 2→4, 3→4). mirror 를 새 구성에 맞게 재배치 (tasks/remirror.yml)
#       기존 4대 이상: 4대 단위로 증설. 기존 mirror 는 그대로
#   - 새 호스트를 expand_new_hosts 그룹에 등록 (이후 play 에서 사용)
# ======================================================

- name: 현재 segment 구성 조회
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      psql -d postgres -At -F '|' -c
      "SELECT role, content, dbid, address, port, datadir, preferred_role, status, mode
       FROM gp_segment_configuration ORDER BY content, role"
  become: true
  become_user: "{{ gpadmin_user }}"
  environment: "{{ whpg_env }}"
  register: _segcfg
  changed_when: false

- name: gpexpand 진행 상태 조회 (postgres DB 의 gpexpand.status)
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      psql -d postgres -At -c
      "SELECT CASE WHEN to_regclass('gpexpand.status') IS NULL THEN 'NONE'
              ELSE coalesce((SELECT status FROM gpexpand.status ORDER BY updated DESC LIMIT 1), 'NONE') END"
  become: true
  become_user: "{{ gpadmin_user }}"
  environment: "{{ whpg_env }}"
  register: _expand_status_q
  changed_when: false

- name: 증설 계획 계산
  ansible.builtin.set_fact:
    _segs: "{{ _seg_rows }}"
    _expand_status: "{{ _expand_status_q.stdout | trim }}"
    # primary(preferred_role) 가 있는 호스트. mirror 재배치로 mirror 만 먼저 옮겨 간 새 호스트는 포함하지 않는다
    _existing_hosts: "{{ _seg_rows | selectattr('content', 'ge', 0) | selectattr('prole', 'equalto', 'p') | map(attribute='address') | unique | list }}"
    _expand_max_content: "{{ _seg_rows | map(attribute='content') | max }}"
    _expand_max_dbid: "{{ _seg_rows | map(attribute='dbid') | max }}"
    _expand_has_mirrors: "{{ _seg_rows | selectattr('content', 'ge', 0) | selectattr('role', 'equalto', 'm') | list | length > 0 }}"
  vars:
    _seg_rows: >-
      {%- set out = [] -%}
      {%- for l in _segcfg.stdout_lines -%}
      {%-   set f = l.split('|') -%}
      {%-   set _ = out.append({'role': f[0], 'content': f[1] | int, 'dbid': f[2] | int,
                               'address': f[3], 'port': f[4] | int, 'datadir': f[5],
                               'prole': f[6], 'status': f[7], 'mode': f[8]}) -%}
      {%- endfor -%}
      {{ out }}

- name: 새 호스트 결정
  ansible.builtin.set_fact:
    _expand_new_hosts: "{{ segment_hosts | reject('in', _existing_hosts) | list }}"
    # 기존 segment 호스트가 2 / 3대 (whpg_mirror_group_size 미만) → 4대까지 증설 + mirror 재배치
    _expand_small: "{{ _existing_hosts | length < whpg_mirror_group_size | int }}"

- name: 증설 조건 확인
  ansible.builtin.assert:
    that:
      # 기존 호스트는 [segments] 앞부분에 그대로 있어야 한다 (순서 = mirror 그룹)
      - _existing_hosts | reject('in', segment_hosts) | list | length == 0
      - segment_hosts[:_existing_hosts | length] | sort == _existing_hosts | sort
      # 2 / 3대 → 4대까지 (2→3, 2→4, 3→4), 4대 이상 → 4대 단위
      - (_expand_small | bool and segment_hosts | length <= whpg_mirror_group_size | int)
        or (not _expand_small | bool and _expand_new_hosts | length % (whpg_mirror_group_size | int) == 0)
      # 포트 규칙이 기존 클러스터와 같아야 한다 (primary: port_base + k, mirror: mirror_port_base + k)
      - _segs | selectattr('content', 'ge', 0) | selectattr('prole', 'equalto', 'p') | map(attribute='port') | unique | sort
        == range(whpg_port_base | int, whpg_port_base | int + primary_data_dirs | length) | list
      # mirror 포트는 재배치 대상(2 / 3대)이면 확인하지 않음 (재배치 중단 후 재실행 시 임시 포트일 수 있음)
      - (not _expand_has_mirrors | bool) or (_expand_small | bool) or
        (_segs | selectattr('content', 'ge', 0) | selectattr('prole', 'equalto', 'm') | map(attribute='port') | unique | sort
         == range(whpg_mirror_port_base | int, whpg_mirror_port_base | int + mirror_data_dirs | length) | list)
    fail_msg: >-
      증설 조건이 맞지 않습니다.
      기존 segment 호스트 {{ _existing_hosts }} 는 inventory [segments] 앞부분에 그대로 있어야 하고,
      새 호스트 {{ _expand_new_hosts }} 는 끝에 추가하되, 기존이 2 / 3대면 합계 {{ whpg_mirror_group_size }}대까지,
      {{ whpg_mirror_group_size }}대 이상이면 {{ whpg_mirror_group_size }}대 단위로 추가해야 합니다.
      (또는 기존 segment 포트가 whpg_port_base / whpg_mirror_port_base 규칙과 다름)
    quiet: true

- name: 새 호스트를 expand_new_hosts 그룹에 등록
  ansible.builtin.add_host:
    name: "{{ item }}"
    groups: expand_new_hosts
  loop: "{{ _expand_new_hosts }}"

- name: 증설 계획 출력
  ansible.builtin.debug:
    msg:
      - "기존 segment 호스트 ({{ _existing_hosts | length }}): {{ _existing_hosts | join(', ') }}"
      - "새 segment 호스트 ({{ _expand_new_hosts | length }}): {{ _expand_new_hosts | join(', ') or '없음' }}"
      - "새 primary {{ (_expand_new_hosts | length) * (primary_data_dirs | length) }}개 (content {{ _expand_max_content | int + 1 }}~), mirror {{ 'O' if _expand_has_mirrors | bool else 'X' }}"
      - "{{ ('mirror 재배치: 기존 ' ~ _existing_hosts | length ~ '대 → ' ~ segment_hosts | length ~ '대 한 그룹 기준으로 기존 mirror 를 gpmovemirrors 로 이동 후 gpexpand')
           if (_expand_small | bool and _expand_has_mirrors | bool and _expand_new_hosts | length > 0) else 'mirror 재배치: 없음 (기존 mirror 유지)' }}"
      - "gpexpand 상태: {{ _expand_status }}"
