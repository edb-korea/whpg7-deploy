---
# ======================================================
# 증설 계획 (coordinator 에서 실행)
#   - gp_segment_configuration 과 inventory [segments] 를 비교해 새 호스트를 찾는다
#     현재 클러스터에 primary 가 없는 [segments] 호스트 = 새 호스트 ([segments] 안의 위치는 상관없음)
#   - 호스트 순서(_expand_hosts, mirror 그룹 기준) = 기존 호스트(현재 클러스터의 content 순서) + 새 호스트([segments] 순서)
#       기존 2 / 3대 : 4대(whpg_mirror_group_size)까지만 증설 (2→3, 2→4, 3→4). mirror 를 새 구성에 맞게 재배치 (tasks/remirror.yml)
#       기존 4대 이상: 4대 단위로 증설. 기존 mirror 는 그대로
#   - 새 호스트를 expand_new_hosts 그룹에 등록 (이후 play 에서 사용)
#   - 기존 segment 호스트의 core / extension RPM 버전을 조회해 _expand_pkg_versions 에 저장
#     (새 호스트는 inventory 의 whpg_version / repo 최신이 아니라 이 버전으로 설치, tasks/prepare.yml)
# ======================================================

- name: 현재 segment 구성 조회
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      psql -d postgres -At -F '|' -c
      "SELECT role, content, dbid, address, port, datadir, preferred_role, status, mode
       FROM gp_segment_configuration ORDER BY content, role"
  become: true
  become_user: "{{ gpadmin_user }}"
  environment: "{{ whpg_env }}"
  register: _segcfg
  changed_when: false
  check_mode: false

# gpexpand 입력 파일의 hostname 열: 새 mirror 가 기존 호스트에 놓일 때 기존 호스트의 등록된 hostname 사용
# (새 호스트는 tasks/prepare.yml 의 _expand_hostname)
- name: 기존 segment 호스트의 hostname 조회 (address → hostname)
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      psql -d postgres -At -F '|' -c
      "SELECT DISTINCT address, hostname FROM gp_segment_configuration WHERE content >= 0"
  become: true
  become_user: "{{ gpadmin_user }}"
  environment: "{{ whpg_env }}"
  register: _seg_hostnames_q
  changed_when: false
  check_mode: false

- name: 기존 segment 호스트 hostname 저장
  ansible.builtin.set_fact:
    _expand_seg_hostnames: >-
      {%- set d = {} -%}
      {%- for l in _seg_hostnames_q.stdout_lines if '|' in l -%}
      {%-   set _ = d.update({l.split('|')[0]: l.split('|')[1]}) -%}
      {%- endfor -%}
      {{ d }}

- name: gpexpand 진행 상태 조회 (postgres DB 의 gpexpand.status)
  ansible.builtin.shell:
    # 테이블 이름은 파싱 시점에 확인되므로 CASE 로 감쌀 수 없음 → 존재 여부를 먼저 따로 조회
    cmd: |
      source {{ whpg_install_dir }}/greenplum_path.sh
      if [ "$(psql -d postgres -Atc "SELECT to_regclass('gpexpand.status') IS NOT NULL")" = "t" ]; then
        psql -d postgres -Atc "SELECT coalesce((SELECT status FROM gpexpand.status ORDER BY updated DESC LIMIT 1), 'NONE')"
      else
        echo NONE
      fi
  become: true
  become_user: "{{ gpadmin_user }}"
  environment: "{{ whpg_env }}"
  register: _expand_status_q
  changed_when: false
  check_mode: false

- name: 증설 계획 계산
  ansible.builtin.set_fact:
    _segs: "{{ _seg_rows }}"
    _expand_status: "{{ _expand_status_q.stdout | trim }}"
    # primary(preferred_role) 가 있는 호스트. mirror 재배치로 mirror 만 먼저 옮겨 간 새 호스트는 포함하지 않는다
    _existing_hosts: "{{ _seg_rows | selectattr('content', 'ge', 0) | selectattr('prole', 'equalto', 'p') | map(attribute='address') | unique | list }}"
    _expand_max_content: "{{ _seg_rows | map(attribute='content') | max }}"
    _expand_max_dbid: "{{ _seg_rows | map(attribute='dbid') | max }}"
    _expand_has_mirrors: "{{ _seg_rows | selectattr('content', 'ge', 0) | selectattr('role', 'equalto', 'm') | list | length > 0 }}"
  vars:
    _seg_rows: >-
      {%- set out = [] -%}
      {%- for l in _segcfg.stdout_lines -%}
      {%-   set f = l.split('|') -%}
      {%-   set _ = out.append({'role': f[0], 'content': f[1] | int, 'dbid': f[2] | int,
                               'address': f[3], 'port': f[4] | int, 'datadir': f[5],
                               'prole': f[6], 'status': f[7], 'mode': f[8]}) -%}
      {%- endfor -%}
      {{ out }}

- name: 새 호스트 결정
  ansible.builtin.set_fact:
    _expand_new_hosts: "{{ segment_hosts | reject('in', _existing_hosts) | list }}"
    # 증설 후 전체 호스트 순서 (mirror 그룹 기준): inventory 순서가 아니라 현재 클러스터 기준
    _expand_hosts: "{{ _existing_hosts + (segment_hosts | reject('in', _existing_hosts) | list) }}"
    # 이번 실행에서 증설 작업(새 호스트 추가 또는 진행 중인 gpexpand 이어서)이 있는지.
    # gpexpand phase 1 뒤에 다시 실행하면 새 호스트가 이미 클러스터에 들어가 _expand_new_hosts 가 비므로,
    # PXF / WEM 처럼 phase 1 이후 단계는 이 값으로 실행 여부를 정한다
    _expand_active: "{{ (segment_hosts | reject('in', _existing_hosts) | list | length > 0) or _expand_status != 'NONE' }}"
    # 기존 segment 호스트가 2 / 3대 (whpg_mirror_group_size 미만) → 4대까지 증설 + mirror 재배치
    _expand_small: "{{ _existing_hosts | length < whpg_mirror_group_size | int }}"

- name: 증설 조건 확인
  ansible.builtin.assert:
    that:
      # 기존 호스트는 모두 [segments] 에 있어야 한다 (접속 정보 / 디렉토리 정리에 필요)
      - _existing_hosts | reject('in', segment_hosts) | list | length == 0
      # 2 / 3대 → 4대까지 (2→3, 2→4, 3→4), 4대 이상 → 4대 단위
      - (_expand_small | bool and _expand_hosts | length <= whpg_mirror_group_size | int)
        or (not _expand_small | bool and _expand_new_hosts | length % (whpg_mirror_group_size | int) == 0)
      # 포트 규칙이 기존 클러스터와 같아야 한다 (primary: port_base + k, mirror: mirror_port_base + k)
      - _segs | selectattr('content', 'ge', 0) | selectattr('prole', 'equalto', 'p') | map(attribute='port') | unique | sort
        == range(whpg_port_base | int, whpg_port_base | int + primary_data_dirs | length) | list
      # mirror 포트는 재배치 대상(2 / 3대)이면 확인하지 않음 (재배치 중단 후 재실행 시 임시 포트일 수 있음)
      - (not _expand_has_mirrors | bool) or (_expand_small | bool) or
        (_segs | selectattr('content', 'ge', 0) | selectattr('prole', 'equalto', 'm') | map(attribute='port') | unique | sort
         == range(whpg_mirror_port_base | int, whpg_mirror_port_base | int + mirror_data_dirs | length) | list)
    fail_msg: >-
      증설 조건이 맞지 않습니다.
      기존 segment 호스트 {{ _existing_hosts }} 중 inventory [segments] 에 없는 것: {{ _existing_hosts | reject('in', segment_hosts) | list }}.
      새 호스트 {{ _expand_new_hosts }} 는 기존이 2 / 3대면 합계 {{ whpg_mirror_group_size }}대까지,
      {{ whpg_mirror_group_size }}대 이상이면 {{ whpg_mirror_group_size }}대 단위로 추가해야 합니다.
      (또는 기존 segment 포트가 whpg_port_base / whpg_mirror_port_base 규칙과 다름)
    quiet: true

# ---------- 기존 호스트의 설치 버전 (새 호스트를 같은 버전으로 설치) ----------
- name: 기존 segment 호스트의 WHPG RPM 버전 조회
  ansible.builtin.command:
    cmd: rpm -qa --qf '%{NAME}\t%{VERSION}-%{RELEASE}\n'
  delegate_to: "{{ item }}"
  loop: "{{ _existing_hosts }}"
  register: _expand_rpm_q
  changed_when: false
  check_mode: false
  when: _expand_new_hosts | length > 0

- name: 기존 호스트 RPM 버전 정리
  ansible.builtin.set_fact:
    # {호스트: {패키지: 버전-릴리스}} (core + 설치 대상 extension 만)
    _expand_host_pkgs: >-
      {%- set out = {} -%}
      {%- for r in _expand_rpm_q.results | default([]) if r.stdout is defined -%}
      {%-   set d = {} -%}
      {%-   for l in r.stdout_lines -%}
      {%-     set f = l.split('\t') -%}
      {%-     if f[0] in _pkgs -%}{%- set _ = d.update({f[0]: f[1]}) -%}{%- endif -%}
      {%-   endfor -%}
      {%-   set _ = out.update({r.item: d}) -%}
      {%- endfor -%}
      {{ out }}
  vars:
    _pkgs: "{{ [whpg_core_pkg_name] + (whpg_extension_catalog | selectattr('enabled') | map(attribute='pkg') | list) }}"
  when: _expand_new_hosts | length > 0

- name: 새 호스트에 설치할 버전 결정 (기존 호스트와 동일)
  ansible.builtin.set_fact:
    _expand_pkg_versions: "{{ _expand_host_pkgs[_existing_hosts | first] }}"
    # 기존 호스트끼리 버전이 다른(또는 일부 호스트에만 있는) 패키지
    _expand_pkg_mismatch: "{{ _mismatch }}"
    # 설치 대상(catalog enabled)인데 기존 호스트에 없는 extension → 새 호스트에는 repo 최신으로 설치
    _expand_pkg_missing: >-
      {{ whpg_extension_catalog | selectattr('enabled') | map(attribute='pkg')
         | reject('in', _expand_host_pkgs[_existing_hosts | first].keys() | list) | list }}
  vars:
    _mismatch: >-
      {%- set names = [] -%}
      {%- for d in _expand_host_pkgs.values() -%}{%- set _ = names.extend(d.keys() | list) -%}{%- endfor -%}
      {%- set out = [] -%}
      {%- for k in names | unique -%}
      {%-   if _expand_host_pkgs.values() | map(attribute=k) | map('default', '') | unique | list | length > 1 -%}
      {%-     set _ = out.append(k) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}
  when: _expand_new_hosts | length > 0

- name: 기존 호스트 버전 일치 확인
  ansible.builtin.assert:
    that:
      - _expand_pkg_versions[whpg_core_pkg_name] is defined
      - _expand_pkg_mismatch | length == 0
    fail_msg: >-
      {{ ('기존 segment 호스트 ' ~ (_existing_hosts | first) ~ ' 에 ' ~ whpg_core_pkg_name ~ ' 이 설치되어 있지 않습니다.')
         if _expand_pkg_versions[whpg_core_pkg_name] is not defined else '' }}
      기존 segment 호스트끼리 버전이 다른 패키지가 있어 새 호스트에 설치할 버전을 정할 수 없습니다:
      {% for k in _expand_pkg_mismatch %}{{ k }} ({% for h, d in _expand_host_pkgs.items() %}{{ h }}={{ d.get(k, '없음') }}{{ ', ' if not loop.last }}{% endfor %}) {% endfor %}
      → playbooks/upgrade/upgrade.yml 로 버전을 맞춘 뒤 다시 실행하세요.
    quiet: true
  when: _expand_new_hosts | length > 0

- name: 새 호스트를 expand_new_hosts 그룹에 등록
  ansible.builtin.add_host:
    name: "{{ item }}"
    groups: expand_new_hosts
  loop: "{{ _expand_new_hosts }}"

- name: 증설 계획 출력
  ansible.builtin.debug:
    msg:
      - "기존 segment 호스트 ({{ _existing_hosts | length }}): {{ _existing_hosts | join(', ') }}"
      - "새 segment 호스트 ({{ _expand_new_hosts | length }}): {{ _expand_new_hosts | join(', ') or '없음' }}"
      - "증설 후 호스트 순서 (mirror 그룹 기준, 현재 클러스터 + 새 호스트): {{ _expand_hosts | join(', ') }}"
      - "새 primary {{ (_expand_new_hosts | length) * (primary_data_dirs | length) }}개 (content {{ _expand_max_content | int + 1 }}~), mirror {{ 'O' if _expand_has_mirrors | bool else 'X' }}"
      - "{{ ('mirror 재배치: 기존 ' ~ _existing_hosts | length ~ '대 → ' ~ _expand_hosts | length ~ '대 한 그룹 기준으로 기존 mirror 를 gpmovemirrors 로 이동 후 gpexpand')
           if (_expand_small | bool and _expand_has_mirrors | bool and _expand_new_hosts | length > 0) else 'mirror 재배치: 없음 (기존 mirror 유지)' }}"
      - "gpexpand 상태: {{ _expand_status }}"
      - "새 호스트 설치 버전 (기존 {{ _existing_hosts | first }} 와 동일): {% for k, v in (_expand_pkg_versions | default({})).items() %}{{ k }} {{ v }}{{ ', ' if not loop.last }}{% else %}-{% endfor %}"
      - "기존 호스트에 없는 extension (새 호스트에는 repo 최신으로 설치): {{ _expand_pkg_missing | default([]) | join(', ') or '없음' }}"
