---
# ======================================================
# Role: whpg_install
# WarehousePG core RPM 설치 (모든 클러스터 노드)
# - 로컬 RPM 디렉토리(local_rpm_dir) 우선 탐색
# - 없으면 dnf fallback
# ======================================================

# ---------- 1. WHPG Core RPM 설치 ----------
- name: "WHPG Core RPM 설치 ({{ whpg_core_pkg_name }} {{ whpg_version }})"
  ansible.builtin.include_role:
    name: rpm_install
  vars:
    rpm_pkg_name: "{{ whpg_core_pkg_name }}"
    rpm_pkg_version: "{{ whpg_version }}"
    rpm_install_state: present

# ---------- 2. 설치 경로 확인 및 symlink 생성 ----------
# 실제 설치 경로: whpg_real_install_dir (기본 /usr/edb/whpg7)
# symlink:       whpg_install_dir (기본 /usr/local/greenplum-db) → whpg_real_install_dir

- name: 실제 설치 디렉토리 확인
  ansible.builtin.stat:
    path: "{{ whpg_real_install_dir }}"
  register: _whpg_real_dir

- name: 실제 설치 디렉토리가 없으면 경고
  ansible.builtin.fail:
    msg: >
      WHPG 설치 디렉토리 {{ whpg_real_install_dir }} 가 존재하지 않습니다.
      RPM 설치 결과를 확인하세요.
  when: not _whpg_real_dir.stat.exists

- name: "{{ whpg_install_dir }} symlink 생성 (없는 경우)"
  ansible.builtin.file:
    src: "{{ whpg_real_install_dir }}"
    dest: "{{ whpg_install_dir }}"
    state: link
    owner: "{{ gpadmin_user }}"
    group: "{{ gpadmin_group }}"
  when: _whpg_real_dir.stat.exists

- name: 실제 설치 디렉토리 소유권 gpadmin으로 변경
  ansible.builtin.file:
    path: "{{ whpg_real_install_dir }}"
    owner: "{{ gpadmin_user }}"
    group: "{{ gpadmin_group }}"
    recurse: true
  when: _whpg_real_dir.stat.exists

# ---------- 3. 데이터 디렉토리 생성 ----------
- name: Coordinator 데이터 디렉토리 생성
  ansible.builtin.file:
    path: "{{ coordinator_data_dir | dirname }}"
    state: directory
    owner: "{{ gpadmin_user }}"
    group: "{{ gpadmin_group }}"
    mode: '0750'
  when: inventory_hostname in groups['coordinator']

- name: Standby 데이터 디렉토리 생성
  ansible.builtin.file:
    path: "{{ standby_data_dir | dirname }}"
    state: directory
    owner: "{{ gpadmin_user }}"
    group: "{{ gpadmin_group }}"
    mode: '0750'
  when: inventory_hostname in groups['standby_coordinator']

- name: Segment Primary 데이터 디렉토리 생성
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ gpadmin_user }}"
    group: "{{ gpadmin_group }}"
    mode: '0750'
  loop: "{{ primary_data_dirs }}"
  when: inventory_hostname in groups['segments']

- name: Segment Mirror 데이터 디렉토리 생성
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ gpadmin_user }}"
    group: "{{ gpadmin_group }}"
    mode: '0750'
  loop: "{{ mirror_data_dirs }}"
  when: inventory_hostname in groups['segments']

# ---------- 4. hostfile 생성 및 gpssh-exkeys ----------
- name: hostfile_all 생성 (gpssh-exkeys 용)
  ansible.builtin.template:
    src: hostfile_all.j2
    dest: "{{ whpg_hostfile_all }}"
    owner: "{{ gpadmin_user }}"
    group: "{{ gpadmin_group }}"
    mode: '0644'
  when: inventory_hostname == coordinator_host

- name: gpssh-exkeys 실행 (클러스터 전체 SSH 키 교환)
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      gpssh-exkeys -f {{ whpg_hostfile_all }}
  become: true
  become_user: "{{ gpadmin_user }}"
  when: inventory_hostname == coordinator_host
  changed_when: true

# ---------- 5. gpcheckperf (선택적 검증) ----------
- name: 네트워크 성능 점검 (선택사항)
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      gpcheckperf -f {{ whpg_hostfile_all }} -r N -d {{ whpg_checkperf_dir }} 2>&1 | tail -20
  become: true
  become_user: "{{ gpadmin_user }}"
  when:
    - inventory_hostname == coordinator_host
    - whpg_run_checkperf | bool
  register: checkperf_result
  changed_when: false

- name: gpcheckperf 결과 출력
  ansible.builtin.debug:
    var: checkperf_result.stdout_lines
  when:
    - inventory_hostname == coordinator_host
    - whpg_run_checkperf | bool
    - checkperf_result is defined
