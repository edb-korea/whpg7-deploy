---
# ======================================================
# rpm_install role 기본값
# 로컬 RPM 디렉토리를 먼저 탐색하고 없으면 dnf로 설치
# 공통 값(local_rpm_dir, rpm_remote_tmp_dir, rpm_dnf_fallback, rpm_disable_gpg_check)은
# inventory/whpg_cluster.yml 에서 관리합니다.
# ======================================================

# 설치 상태 (present / latest)
rpm_install_state: present

# 특정 버전만 설치할 때 지정 (예: "7.5.0"). 비우면 최신
rpm_pkg_version: ""

# dnf fallback 실패를 무시할지 (업그레이드 시 레포에 없는 패키지가 있어도 계속 진행)
rpm_ignore_dnf_errors: false
