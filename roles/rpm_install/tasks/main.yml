---
# ======================================================
# Role: rpm_install
# Ansible Controller Node의 local_rpm_dir 에서 먼저 탐색 (select.yml)
# → 파일 있으면 대상 노드에 복사 후 yum localinstall
# → 없으면 dnf install (fallback)
#
# 사용법:
#   - ansible.builtin.include_role:
#       name: rpm_install
#     vars:
#       rpm_pkg_name: "edb-whpg7-pgaudit"   # RPM 패키지명 (정확히 일치)
#       rpm_pkg_version: "7.5.0"            # 선택: 특정 버전만 (생략 시 최신). "7.5.0_WHPG-1.el9" 처럼 버전-릴리스 전체도 가능
#       rpm_install_state: latest           # 선택: present(기본) / latest
# ======================================================

# ---------- Step 1: Controller Node에서 로컬 RPM 선택 ----------
- name: "{{ rpm_pkg_name }} - Controller 로컬 RPM 선택"
  ansible.builtin.include_tasks: select.yml

- name: "{{ rpm_pkg_name }} - 로컬 RPM 발견 여부 출력"
  ansible.builtin.debug:
    msg: >
      [{{ rpm_pkg_name }}{{ ' ' ~ rpm_pkg_version if rpm_pkg_version | default('') else '' }}]
      Controller 로컬 RPM:
      {{ _rpm_selected if _rpm_selected else '없음 → dnf fallback' }}

# ---------- Step 2: 로컬 RPM 있으면 → 대상 노드로 복사 후 설치 ----------
- name: "{{ rpm_pkg_name }} - 로컬 RPM 설치"
  when: _rpm_selected | length > 0
  block:
    - name: "{{ rpm_pkg_name }} - 대상 노드 임시 디렉토리 생성"
      ansible.builtin.file:
        path: "{{ rpm_remote_tmp_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: "{{ rpm_pkg_name }} - Controller → 대상 노드로 RPM 복사"
      ansible.builtin.copy:
        src: "{{ _rpm_selected }}"
        dest: "{{ rpm_remote_tmp_dir }}/{{ _rpm_selected | basename }}"
        owner: root
        group: root
        mode: '0644'

    - name: "{{ rpm_pkg_name }} - 로컬 RPM으로 설치 (yum localinstall)"
      ansible.builtin.yum:
        name: "{{ rpm_remote_tmp_dir }}/{{ _rpm_selected | basename }}"
        state: "{{ rpm_install_state }}"
        disable_gpg_check: "{{ rpm_disable_gpg_check }}"
      register: _rpm_local_install
      ignore_errors: "{{ ansible_check_mode }}"   # --check 에서는 복사가 안 되므로 파일 없음 오류 무시

  always:
    - name: "{{ rpm_pkg_name }} - 복사된 임시 RPM 파일 정리"
      ansible.builtin.file:
        path: "{{ rpm_remote_tmp_dir }}/{{ _rpm_selected | basename }}"
        state: absent

# ---------- Step 3: 로컬 RPM 없으면 → dnf fallback ----------
# rpm_pkg_version 지정 시 "이름-버전*" 으로 해당 버전만 설치
- name: "{{ rpm_pkg_name }} - dnf 설치 (fallback)"
  ansible.builtin.dnf:
    name: "{{ rpm_pkg_name ~ ('-' ~ rpm_pkg_version ~ '*' if rpm_pkg_version | default('') else '') }}"
    state: "{{ rpm_install_state }}"
    disable_gpg_check: "{{ rpm_disable_gpg_check }}"
  when:
    - _rpm_selected | length == 0
    - rpm_dnf_fallback | bool
  register: _rpm_dnf_install
  ignore_errors: "{{ rpm_ignore_dnf_errors }}"

# ---------- Step 4: 둘 다 불가 시 실패 ----------
- name: "{{ rpm_pkg_name }} - 설치 불가 (로컬 없음 + fallback 비활성)"
  ansible.builtin.fail:
    msg: >
      패키지 '{{ rpm_pkg_name }}' 를 설치할 수 없습니다.
      Controller의 '{{ local_rpm_dir }}' 에 RPM 파일이 없고
      rpm_dnf_fallback=false 로 설정되어 있습니다.
      RPM 파일을 {{ local_rpm_dir }} 에 배치하거나
      rpm_dnf_fallback=true 로 설정하세요.
  when:
    - _rpm_selected | length == 0
    - not (rpm_dnf_fallback | bool)

# ---------- Step 5: 결과 요약 ----------
- name: "{{ rpm_pkg_name }} - 설치 결과 요약"
  ansible.builtin.debug:
    msg: >
      ✓ [{{ rpm_pkg_name }}]
      소스: {{ '로컬: ' ~ (_rpm_selected | basename) if _rpm_selected else 'dnf (원격)' }}
      변경: {{ _rpm_local_install.changed | default(false) or
               _rpm_dnf_install.changed | default(false) }}
  when: not ansible_check_mode
