---
# ======================================================
# Role: rpm_install
# 사용법:
#   - name: pgaudit 설치
#     include_role:
#       name: rpm_install
#     vars:
#       rpm_pkg_name: "edb-whpg7-pgaudit"
#       rpm_pkg_pattern: "edb-whpg7-pgaudit*.rpm"   # 로컬 파일 glob (생략 시 pkg_name*.rpm)
#
# 동작:
#   1. local_rpm_dir 에서 rpm_pkg_pattern glob 검색
#   2. 파일이 있으면 → yum localinstall
#   3. 파일이 없고 rpm_dnf_fallback=true → dnf install
#   4. rpm_dnf_fallback=false → 에러
# ======================================================

- name: "{{ rpm_pkg_name }} - 로컬 RPM 디렉토리 탐색"
  ansible.builtin.find:
    paths: "{{ local_rpm_dir }}"
    patterns: "{{ rpm_pkg_pattern | default(rpm_pkg_name + '*.rpm') }}"
    recurse: false
  register: _rpm_local_found
  ignore_errors: true

- name: "{{ rpm_pkg_name }} - 로컬 RPM 설치 (파일 발견 시)"
  ansible.builtin.yum:
    name: "{{ _rpm_local_found.files | map(attribute='path') | sort | last }}"
    state: "{{ rpm_install_state | default('present') }}"
    disable_gpg_check: "{{ rpm_disable_gpg_check }}"
  when: _rpm_local_found.files | length > 0
  register: _rpm_local_install

- name: "{{ rpm_pkg_name }} - dnf fallback 설치 (로컬 파일 없을 때)"
  ansible.builtin.dnf:
    name: "{{ rpm_pkg_name }}"
    state: "{{ rpm_install_state | default('present') }}"
    disable_gpg_check: "{{ rpm_disable_gpg_check }}"
  when:
    - _rpm_local_found.files | length == 0
    - rpm_dnf_fallback | bool
  register: _rpm_dnf_install

- name: "{{ rpm_pkg_name }} - 설치 불가 (로컬 없음 + fallback 비활성)"
  ansible.builtin.fail:
    msg: >
      패키지 '{{ rpm_pkg_name }}' 를 설치할 수 없습니다.
      로컬 디렉토리 '{{ local_rpm_dir }}' 에 RPM 파일이 없고
      rpm_dnf_fallback=false 로 설정되어 있습니다.
  when:
    - _rpm_local_found.files | length == 0
    - not (rpm_dnf_fallback | bool)

- name: "{{ rpm_pkg_name }} - 설치 결과 요약"
  ansible.builtin.debug:
    msg: >
      [{{ rpm_pkg_name }}]
      소스: {{ '로컬 RPM: ' + (_rpm_local_found.files | map(attribute='path') | sort | last | default('N/A'))
               if _rpm_local_found.files | length > 0
               else 'dnf (원격)' }}
      상태: {{ 'changed' if (_rpm_local_install is defined and _rpm_local_install.changed)
                         or (_rpm_dnf_install is defined and _rpm_dnf_install.changed)
               else 'already installed' }}
  when: not ansible_check_mode
