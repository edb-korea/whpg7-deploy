---
# ======================================================
# Role: whpg_init
# 순서: cluster init (primary) → mirror (gpaddmirrors -i) → standby coordinator
# ======================================================

# ---------- 0. Mirror 그룹 구성 가능 여부 확인 (gpinitsystem 전에 중단) ----------
- name: Mirror 그룹 조건 확인 (segment {{ whpg_mirror_group_size }}대 단위)
  ansible.builtin.assert:
    that:
      - segment_hosts | length > 0
      - segment_hosts | length % (whpg_mirror_group_size | int) == 0
      - (whpg_mirror_group_size | int) >= 2
      - primary_data_dirs | length == whpg_segments_per_host | int
      - primary_data_dirs | length == mirror_data_dirs | length
      - (whpg_segments_per_host | int) % (whpg_data_mounts | length) == 0
    fail_msg: >-
      segment 호스트 수({{ segment_hosts | length }}: {{ segment_hosts | join(', ') }})는
      whpg_mirror_group_size({{ whpg_mirror_group_size }})의 배수여야 하고,
      호스트당 segment 수(whpg_segments_per_host={{ whpg_segments_per_host }})는
      데이터 디스크 수({{ whpg_data_mounts | length }})의 배수여야 합니다 (디스크별 균등 배치).
      inventory/hosts 의 [segments] 를 확인하세요.
    quiet: true
  run_once: true

# ---------- 1. gpinitsystem 설정파일 생성 ----------
- name: gpinitsystem_config 생성
  ansible.builtin.template:
    src: gpinitsystem_config.j2
    dest: "{{ whpg_gpinitsystem_config }}"
    owner: "{{ gpadmin_user }}"
    group: "{{ gpadmin_group }}"
    mode: '0644'
  when: inventory_hostname == coordinator_host

- name: seg_hosts 파일 생성 (세그먼트 전용)
  ansible.builtin.template:
    src: seg_hosts.j2
    dest: "{{ whpg_hostfile_segments }}"
    owner: "{{ gpadmin_user }}"
    group: "{{ gpadmin_group }}"
    mode: '0644'
  when: inventory_hostname == coordinator_host

# ---------- 2. gpinitsystem 실행 (Cluster 초기화) ----------
- name: WarehousePG 클러스터 초기화 (gpinitsystem)
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      gpinitsystem -c {{ whpg_gpinitsystem_config }}
      -h {{ whpg_hostfile_segments }} -a 2>&1
  become: true
  become_user: "{{ gpadmin_user }}"
  environment: "{{ whpg_env }}"
  when: inventory_hostname == coordinator_host
  register: gpinit_result
  changed_when: "'Greenplum Database instance successfully created' in gpinit_result.stdout or
                 'WarehousePG instance successfully created' in gpinit_result.stdout"
  failed_when:
    - gpinit_result.rc != 0
    - "'already exists' not in gpinit_result.stdout"

- name: gpinitsystem 결과 출력
  ansible.builtin.debug:
    var: gpinit_result.stdout_lines
  when: inventory_hostname == coordinator_host

# ---------- 3. Mirror 세그먼트 추가 ({{ whpg_mirror_group_size }}대 단위 spread, gpaddmirrors -i) ----------
- name: Mirror 세그먼트 추가
  ansible.builtin.include_tasks: mirrors.yml
  when: inventory_hostname == coordinator_host

# ---------- 4. Standby Coordinator 추가 ----------
- name: Standby Coordinator 추가 (gpinitstandby)
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      gpinitstandby -s {{ standby_coordinator_host }} -S {{ standby_data_dir }} -a 2>&1
  become: true
  become_user: "{{ gpadmin_user }}"
  environment: "{{ whpg_env }}"
  when: inventory_hostname == coordinator_host
  register: standby_result
  changed_when: "'Standby coordinator successfully created' in standby_result.stdout"
  failed_when:
    - standby_result.rc != 0
    - "'already' not in standby_result.stderr | default('')"

- name: Standby 추가 결과 출력
  ansible.builtin.debug:
    var: standby_result.stdout_lines
  when: inventory_hostname == coordinator_host

# ---------- 5. 기본 DB 파라미터 설정 ----------
- name: postgresql.conf 추가 파라미터 설정
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      gpconfig -c {{ item.name }} -v "{{ item.value }}"
      {% if item.coordinator_value is defined %}-m "{{ item.coordinator_value }}"{% endif %} 2>&1
  become: true
  become_user: "{{ gpadmin_user }}"
  environment: "{{ whpg_env }}"
  loop: "{{ whpg_gpconfig_params + whpg_gpconfig_params_extra }}"
  loop_control:
    label: "{{ item.name }}"
  when: inventory_hostname == coordinator_host
  changed_when: true

- name: pg_stat_statements CREATE EXTENSION
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      psql -d {{ whpg_database }} -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;" 2>&1
  become: true
  become_user: "{{ gpadmin_user }}"
  environment: "{{ whpg_env }}"
  when: inventory_hostname == coordinator_host
  changed_when: true

- name: WHPG 재시작 (파라미터 적용)
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      gpstop -ra -a 2>&1
  become: true
  become_user: "{{ gpadmin_user }}"
  environment: "{{ whpg_env }}"
  when: inventory_hostname == coordinator_host
  changed_when: true

# ---------- 6. pg_hba.conf 기본 접근 설정 ----------
- name: pg_hba.conf 접근 규칙 추가
  ansible.builtin.blockinfile:
    path: "{{ coordinator_data_dir }}/pg_hba.conf"
    marker: "# {mark} Ansible Managed WHPG Access Rules"
    block: |
      {% for rule in whpg_pg_hba_rules %}
      {{ rule.type }}    {{ rule.database }}    {{ rule.user }}    {{ rule.address }}    {{ rule.method }}
      {% endfor %}
  when: inventory_hostname == coordinator_host
  notify: reload_whpg

# ---------- 7. 타임존 설정 ----------
- name: DB 타임존 설정
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      gpconfig -c TimeZone -v '{{ whpg_timezone }}' 2>&1
  become: true
  become_user: "{{ gpadmin_user }}"
  environment: "{{ whpg_env }}"
  when: inventory_hostname == coordinator_host
  changed_when: true

# ---------- 8. resource group 활성화 ----------
- name: resource group cgroup 마운트 확인
  ansible.builtin.shell:
    cmd: mount | grep cgroup
  register: cgroup_mount
  changed_when: false
  failed_when: false
  when: inventory_hostname == coordinator_host

- name: "gpconfig resource_manager 설정 ({{ whpg_resource_manager }})"
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      gpconfig -c gp_resource_manager -v '{{ whpg_resource_manager }}' 2>&1
  become: true
  become_user: "{{ gpadmin_user }}"
  environment: "{{ whpg_env }}"
  when: inventory_hostname == coordinator_host
  changed_when: true
