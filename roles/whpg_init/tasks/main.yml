---
# ======================================================
# Role: whpg_init
# 순서: cluster init (primary) → mirror (gpaddmirrors -i) → standby coordinator
# ======================================================

# ---------- 0. Mirror 그룹 구성 가능 여부 확인 (gpinitsystem 전에 중단) ----------
- name: Mirror 그룹 조건 확인 (segment {{ whpg_mirror_group_size }}대 단위 또는 2 ~ {{ whpg_mirror_group_size | int - 1 }}대)
  ansible.builtin.assert:
    that:
      - segment_hosts | length >= 2
      - (segment_hosts | length % (whpg_mirror_group_size | int) == 0) or (segment_hosts | length < whpg_mirror_group_size | int)
      - (whpg_mirror_group_size | int) >= 2
      - primary_data_dirs | length == whpg_segments_per_host | int
      - primary_data_dirs | length == mirror_data_dirs | length
      - (whpg_segments_per_host | int) % (whpg_data_mounts | length) == 0
      - whpg_data_mounts | map(attribute='path') | unique | list | length == whpg_data_mounts | length
      # gpconfig: segment 의 max_connections 는 coordinator 보다 커야 함
      - (whpg_seg_max_connections | int) > (whpg_max_connections | int)
    fail_msg: >-
      segment 호스트 수({{ segment_hosts | length }}: {{ segment_hosts | join(', ') }})는
      whpg_mirror_group_size({{ whpg_mirror_group_size }})의 배수이거나 2 ~ {{ whpg_mirror_group_size | int - 1 }}대여야 하고 (mirror 를 두려면 최소 2대),
      호스트당 segment 수(whpg_segments_per_host={{ whpg_segments_per_host }})는
      데이터 디스크 수({{ whpg_data_mounts | length }})의 배수여야 합니다 (디스크별 균등 배치).
      또 whpg_seg_max_connections({{ whpg_seg_max_connections }})는 whpg_max_connections({{ whpg_max_connections }})보다 커야 합니다.
      inventory/hosts 의 [segments] 를 확인하세요.
    quiet: true
  run_once: true

# inventory 이름이 실제 hostname 과 다르면 gpinitsystem(primary: 실제 hostname)과 gpaddmirrors(mirror: inventory 이름)가
# gp_segment_configuration.hostname 에 서로 다른 이름을 기록해, PXF 등이 같은 서버를 두 대로 인식한다
- name: inventory 이름 = 실제 hostname 확인
  ansible.builtin.assert:
    that: _name_mismatch | length == 0
    fail_msg: >-
      inventory 이름과 실제 hostname 이 다릅니다: {{ _name_mismatch | join(', ') }}.
      inventory/hosts 의 호스트 이름을 각 서버의 hostname 으로 바꾸세요 (ansible_host 는 그대로).
    quiet: true
  vars:
    _name_mismatch: >-
      {%- set out = [] -%}
      {%- for h in groups['whpg_cluster'] if hostvars[h].ansible_hostname is defined and hostvars[h].ansible_hostname != h -%}
      {%- set _ = out.append(h ~ ' → ' ~ hostvars[h].ansible_hostname) -%}
      {%- endfor -%}
      {{ out }}
  when: inventory_hostname == coordinator_host
  run_once: true

# segment 호스트마다 인스턴스(primary + mirror) × shared_buffers 가 메모리의 절반을 넘으면 중단
# (vm.overcommit_memory=2 에서 shared memory 할당 실패로 일부 segment 가 시작되지 않음)
# 호스트 메모리 정보(facts)가 없으면 건너뜀 (Phase 3 단독 실행 시)
- name: shared_buffers 메모리 확인 (segment 호스트당 인스턴스 {{ (whpg_segments_per_host | int) * 2 }}개)
  ansible.builtin.assert:
    that: (_sb_mb | float) * (whpg_segments_per_host | int) * 2 <= (_mem_mb | int) * 0.5
    fail_msg: >-
      whpg_shared_buffers({{ whpg_shared_buffers }}) × 인스턴스 {{ (whpg_segments_per_host | int) * 2 }}개
      = {{ ((_sb_mb | float) * (whpg_segments_per_host | int) * 2) | int }}MB 가 segment 호스트 메모리({{ _mem_mb }}MB)의 50% 를 넘습니다.
      whpg_shared_buffers 를 줄이세요 (예: {{ ((_mem_mb | int) * 0.25 / ((whpg_segments_per_host | int) * 2)) | int }}MB 이하).
    quiet: true
  vars:
    _sb: "{{ whpg_shared_buffers | string | regex_search('^([0-9]+)\\s*([kKmMgGtT]?)', '\\1', '\\2') }}"
    _sb_mb: "{{ (_sb[0] | int) * {'': 1/128, 'k': 1/1024, 'm': 1, 'g': 1024, 't': 1048576}[_sb[1] | lower] }}"
    _mem_mb: "{{ segment_hosts | map('extract', hostvars, 'ansible_memtotal_mb') | select('defined') | min | default(0) }}"
  when:
    - _mem_mb | int > 0
    - inventory_hostname == coordinator_host
  run_once: true

# ---------- 1. gpinitsystem 설정파일 생성 ----------
- name: gpinitsystem_config 생성
  ansible.builtin.template:
    src: gpinitsystem_config.j2
    dest: "{{ whpg_gpinitsystem_config }}"
    owner: "{{ gpadmin_user }}"
    group: "{{ gpadmin_group }}"
    mode: '0644'
  when: inventory_hostname == coordinator_host

- name: seg_hosts 파일 생성 (세그먼트 전용)
  ansible.builtin.template:
    src: seg_hosts.j2
    dest: "{{ whpg_hostfile_segments }}"
    owner: "{{ gpadmin_user }}"
    group: "{{ gpadmin_group }}"
    mode: '0644'
  when: inventory_hostname == coordinator_host

# ---------- 2. gpinitsystem 실행 (Cluster 초기화) ----------
- name: WarehousePG 클러스터 초기화 (gpinitsystem)
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      gpinitsystem -c {{ whpg_gpinitsystem_config }}
      -h {{ whpg_hostfile_segments }} -a 2>&1
  become: true
  become_user: "{{ gpadmin_user }}"
  environment: "{{ whpg_env }}"
  when: inventory_hostname == coordinator_host
  register: gpinit_result
  changed_when: "'Greenplum Database instance successfully created' in gpinit_result.stdout or
                 'WarehousePG instance successfully created' in gpinit_result.stdout"
  failed_when:
    - gpinit_result.rc != 0
    - "'already exists' not in gpinit_result.stdout"

- name: gpinitsystem 결과 출력
  ansible.builtin.debug:
    var: gpinit_result.stdout_lines
  when: inventory_hostname == coordinator_host

# ---------- 3. Mirror 세그먼트 추가 (첫 그룹 whpg_mirror_first_group_size 대, 이후 whpg_mirror_group_size 대 단위 spread, gpaddmirrors -i) ----------
- name: Mirror 세그먼트 추가
  ansible.builtin.include_tasks: mirrors.yml
  when: inventory_hostname == coordinator_host

# ---------- 4. Standby Coordinator 추가 ----------
- name: Standby Coordinator 추가 (gpinitstandby)
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      gpinitstandby -s {{ standby_coordinator_host }} -S {{ standby_data_dir }} -a 2>&1
  become: true
  become_user: "{{ gpadmin_user }}"
  environment: "{{ whpg_env }}"
  when: inventory_hostname == coordinator_host
  register: standby_result
  changed_when: "'Standby coordinator successfully created' in standby_result.stdout"
  failed_when:
    - standby_result.rc != 0
    - "'already' not in standby_result.stdout"   # 2>&1 이므로 stdout 에서 확인 (이미 있으면 재실행 시 통과)

- name: Standby 추가 결과 출력
  ansible.builtin.debug:
    var: standby_result.stdout_lines
  when: inventory_hostname == coordinator_host

# ---------- 5. 기본 DB 파라미터 설정 ----------
- name: postgresql.conf 추가 파라미터 설정
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      gpconfig -c {{ item.name }} -v "{{ item.value }}"
      {% if item.coordinator_value is defined %}-m "{{ item.coordinator_value }}"{% endif %} 2>&1
  become: true
  become_user: "{{ gpadmin_user }}"
  environment: "{{ whpg_env }}"
  loop: "{{ whpg_gpconfig_params + whpg_gpconfig_params_extra }}"
  loop_control:
    label: "{{ item.name }}"
  when: inventory_hostname == coordinator_host
  changed_when: true

- name: pg_stat_statements CREATE EXTENSION
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      psql -d {{ whpg_database }} -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;" 2>&1
  become: true
  become_user: "{{ gpadmin_user }}"
  environment: "{{ whpg_env }}"
  when: inventory_hostname == coordinator_host
  changed_when: true

- name: WHPG 재시작 (파라미터 적용)
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      gpstop -ra -a 2>&1
  become: true
  become_user: "{{ gpadmin_user }}"
  environment: "{{ whpg_env }}"
  when: inventory_hostname == coordinator_host
  changed_when: true

# ---------- 6. pg_hba.conf 기본 접근 설정 ----------
- name: pg_hba.conf 접근 규칙 추가
  ansible.builtin.blockinfile:
    path: "{{ coordinator_data_dir }}/pg_hba.conf"
    marker: "# {mark} Ansible Managed WHPG Access Rules"
    block: |
      {% for rule in whpg_pg_hba_rules %}
      {{ rule.type }}    {{ rule.database }}    {{ rule.user }}    {{ rule.address }}    {{ rule.method }}
      {% endfor %}
  when: inventory_hostname == coordinator_host
  notify: reload_whpg

# ---------- 7. 타임존 설정 ----------
- name: DB 타임존 설정
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      gpconfig -c TimeZone -v '{{ whpg_timezone }}' 2>&1
  become: true
  become_user: "{{ gpadmin_user }}"
  environment: "{{ whpg_env }}"
  when: inventory_hostname == coordinator_host
  changed_when: true

# ---------- 8. resource group 활성화 ----------
- name: resource group cgroup 마운트 확인
  ansible.builtin.shell:
    cmd: mount | grep cgroup
  register: cgroup_mount
  changed_when: false
  failed_when: false
  when: inventory_hostname == coordinator_host

# cgroup v2: os_preconfig 의 gpdb.service 가 whpg_cgroup_dir(/sys/fs/cgroup/gpdb)를 만든다.
# WHPG 의 gp_resource_group_cgroup_parent 기본값은 gpdb.service 이므로 같은 디렉토리로 맞춘 뒤 재시작하고,
# 그 다음 gp_resource_manager 를 설정 (gpconfig 검증은 실행 중인 cgroup_parent 기준) → 재시작
- name: resource group 현재 설정 조회
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      psql -d postgres -Atc "show gp_resource_group_cgroup_parent" &&
      psql -d postgres -Atc "show gp_resource_manager"
  become: true
  become_user: "{{ gpadmin_user }}"
  environment: "{{ whpg_env }}"
  register: _rg_cur
  changed_when: false
  check_mode: false
  when: inventory_hostname == coordinator_host

- name: resource group 설정
  when: inventory_hostname == coordinator_host
  become: true
  become_user: "{{ gpadmin_user }}"
  environment: "{{ whpg_env }}"
  vars:
    _rg_parent: "{{ whpg_cgroup_dir | regex_replace('^/sys/fs/cgroup/', '') }}"
    _gp: "source {{ whpg_install_dir }}/greenplum_path.sh"
  block:
    - name: "gp_resource_group_cgroup_parent = {{ _rg_parent }} (재시작)"
      ansible.builtin.shell:
        cmd: "{{ _gp }} && gpconfig -c gp_resource_group_cgroup_parent -v '{{ _rg_parent }}' 2>&1 && gpstop -ra -a -M fast 2>&1 | tail -n 2"
      when: _rg_cur.stdout_lines[0] != _rg_parent

    - name: "gpconfig resource_manager 설정 ({{ whpg_resource_manager }}, 재시작)"
      ansible.builtin.shell:
        cmd: "{{ _gp }} && gpconfig -c gp_resource_manager -v '{{ whpg_resource_manager }}' 2>&1 && gpstop -ra -a -M fast 2>&1 | tail -n 2"
      when: _rg_cur.stdout_lines[1] != whpg_resource_manager
