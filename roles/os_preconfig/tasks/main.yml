---
# ======================================================
# Role: os_preconfig
# RHEL 기반 OS 사전 구성 (모든 WHPG 클러스터 노드)
# ======================================================

# ---------- 1. SELinux 비활성화 ----------
# ansible.posix.selinux 모듈은 원격 Python에 selinux 바인딩이 필요하므로
# (python3.11 환경에는 없음) 설정파일 + setenforce 로 처리
- name: SELinux 비활성화 (설정파일, 리부팅 후 적용)
  ansible.builtin.lineinfile:
    path: /etc/selinux/config
    regexp: '^SELINUX='
    line: 'SELINUX=disabled'
  notify: reboot_required

- name: SELinux 현재 모드 확인
  ansible.builtin.command: getenforce
  register: _getenforce
  changed_when: false
  check_mode: false

- name: SELinux permissive 전환 (즉시 적용)
  ansible.builtin.command: setenforce 0
  when: _getenforce.stdout | trim == 'Enforcing'

# SSSD 사용 시 SELinux 비활성화 후 SSH 인증 거부 방지 (selinux_provider=none)
# sssd.conf 를 직접 수정하지 않고 conf.d drop-in 으로 각 domain 섹션에 병합
- name: SSSD domain 목록 조회
  ansible.builtin.shell:
    cmd: >-
      grep -hoP '^\s*\[domain/\K[^\]]+' /etc/sssd/sssd.conf /etc/sssd/conf.d/*.conf
      2>/dev/null | sort -u
  register: _sssd_domains
  changed_when: false
  failed_when: false
  check_mode: false

- name: SSSD selinux_provider=none 설정 (conf.d drop-in)
  ansible.builtin.copy:
    dest: "{{ sssd_selinux_dropin_file }}"
    content: |
      # Managed by Ansible (os_preconfig) - WarehousePG SELinux 비활성화 대응
      {% for domain in _sssd_domains.stdout_lines %}
      [domain/{{ domain }}]
      selinux_provider = none

      {% endfor %}
    owner: root
    group: root
    mode: '0600'
  when: _sssd_domains.stdout_lines | length > 0
  notify: restart_sssd

# ---------- 2. firewalld 비활성화 ----------
- name: firewalld 중지 및 비활성화
  ansible.builtin.systemd:
    name: firewalld
    state: stopped
    enabled: false
  ignore_errors: true

# ---------- 3. /etc/hosts 구성 (증설 시 기존 노드에도 이 파일만 실행) ----------
- name: /etc/hosts 구성
  ansible.builtin.import_tasks: hosts.yml

# ---------- 4. sysctl OS 파라미터 ----------
- name: sysctl 파라미터 설정 (kernel/vm/net)
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: "{{ whpg_sysctl_file }}"
    reload: true
  loop: "{{ os_sysctl_params | combine(os_sysctl_params_extra) | dict2items }}"

# ---------- 5. PAM / Ulimits ----------
- name: gpadmin 사용자 ulimits 설정 (/etc/security/limits.d)
  ansible.builtin.copy:
    dest: "{{ gpadmin_limits_file }}"
    content: |
      {% for item, value in gpadmin_limits.items() %}
      {{ gpadmin_user }} soft {{ item }} {{ value }}
      {{ gpadmin_user }} hard {{ item }} {{ value }}
      {% endfor %}
    owner: root
    group: root
    mode: '0644'

# ---------- 6. cgroup v2 설정 (모든 노드) ----------
# 참고: https://github.com/unixfree/WarehousePG-Tip/blob/main/11.Resource%20Group%20v2.md
# RHEL 9: cgroup v2 기본값이나 명시적으로 활성화 보장
# RHEL 8: grub 파라미터로 cgroup v2 강제 활성화 필요

- name: cgroup v2 현재 활성화 여부 확인
  ansible.builtin.shell:
    cmd: mount | grep cgroup2
  register: _cgroup2_mount
  changed_when: false
  failed_when: false

- name: cgroup v2 활성화 상태 출력
  ansible.builtin.debug:
    msg: "cgroup v2 상태: {{ 'active' if _cgroup2_mount.rc == 0 else 'inactive (grub 설정 필요)' }}"

# RHEL 8 / cgroup v1 사용 중인 경우: grub 파라미터 추가 후 reboot 필요
- name: grub에 cgroup v2 강제 활성화 파라미터 추가 (cgroup v2 미활성 시)
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '(GRUB_CMDLINE_LINUX=.*)"$'
    replace: '\1 cgroup_no_v1=all systemd.unified_cgroup_hierarchy=1"'
  when: _cgroup2_mount.rc != 0
  notify: update_grub

# cgroup v1 강제 파라미터가 남아 있으면 제거 (혹시 이전 설정)
- name: cgroup v1 강제 파라미터 제거 (v2 활성 환경)
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '\s*systemd\.unified_cgroup_hierarchy=0'
    replace: ''
  when: _cgroup2_mount.rc == 0

# ---------- 6-1. gpdb.service systemd 서비스 등록 (재부팅 후 cgroup 자동 구성) ----------
# 문서 기준: /etc/systemd/system/gpdb.service 로 등록
- name: "{{ whpg_cgroup_service_name }}.service systemd 서비스 파일 배포 (cgroup v2 자동 설정)"
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ whpg_cgroup_service_name }}.service"
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=WarehousePG Cgroup v2 Configuration Service
      After=local-fs.target systemd-tmpfiles-setup.service

      [Service]
      # oneshot: cgroup 경로만 생성하고 종료 (WHPG 프로세스에 간섭 없음)
      Type=oneshot
      RemainAfterExit=yes
      Slice=-.slice
      Delegate=yes

      # cgroup2 파일시스템이 마운트된 경우에만 실행
      ExecCondition=bash -c '[ xcgroup2fs = x$(stat -fc "%%T" /sys/fs/cgroup) ] || exit 1'

      # 최상위 cgroup.procs 를 gpadmin 이 쓸 수 있어야 한다: postmaster 가 ssh 세션의 cgroup(user.slice)에서
      # {{ whpg_cgroup_dir }} 아래로 자신을 옮길 때 공통 조상(/sys/fs/cgroup)의 cgroup.procs 쓰기 권한이 필요
      # (없으면 "can't write data to file '.../queries/cgroup.procs': Permission denied" 로 segment 시작 실패)
      # /sys/fs/cgroup 은 재부팅 때마다 초기화되므로 이 서비스가 매번 다시 설정한다
      ExecStart=bash -ec '\
        echo "{{ whpg_cgroup_controllers }}" > /sys/fs/cgroup/cgroup.subtree_control; \
        chown {{ gpadmin_user }}:{{ gpadmin_group }} /sys/fs/cgroup/cgroup.procs; \
        chmod 660 /sys/fs/cgroup/cgroup.procs; \
        mkdir -p {{ whpg_cgroup_dir }}; \
        chown -R {{ gpadmin_user }}:{{ gpadmin_group }} {{ whpg_cgroup_dir }}; \
        echo "{{ whpg_cgroup_controllers }}" > {{ whpg_cgroup_dir }}/cgroup.subtree_control; \
        echo "WarehousePG cgroup v2 setup complete: {{ whpg_cgroup_dir }}"'

      [Install]
      WantedBy=multi-user.target
  register: _gpdb_service_unit

- name: "{{ whpg_cgroup_service_name }}.service systemd 데몬 리로드 및 활성화"
  ansible.builtin.systemd:
    name: "{{ whpg_cgroup_service_name }}.service"
    enabled: true
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"  # check 모드에서는 유닛 파일이 생성되지 않음

# 유닛 파일이 바뀌었으면 다시 실행 (oneshot + RemainAfterExit 라 started 만으로는 재실행되지 않음)
- name: "{{ whpg_cgroup_service_name }}.service 즉시 실행 (현재 세션에 cgroup 적용)"
  ansible.builtin.systemd:
    name: "{{ whpg_cgroup_service_name }}.service"
    state: "{{ 'restarted' if _gpdb_service_unit is changed else 'started' }}"
  register: _gpdb_service_start
  failed_when: false  # cgroup2 미활성 환경에서는 ExecCondition 실패 허용

- name: cgroup v2 gpdb 디렉토리 확인
  ansible.builtin.stat:
    path: "{{ whpg_cgroup_dir }}"
  register: _gpdb_cgroup_dir

- name: cgroup v2 gpdb 설정 결과 출력
  ansible.builtin.debug:
    msg: >
      {{ whpg_cgroup_dir }}:
      {{ '생성됨 ✓' if _gpdb_cgroup_dir.stat.exists else
         '미생성 - cgroup v2가 활성화되지 않았습니다. reboot 후 재시도하세요.' }}

# ---------- 7. gpadmin 사용자 / 그룹 생성 ----------
# 이미 있는 계정 / 그룹은 기존 uid / gid 를 그대로 쓰고 (실행 중인 프로세스, 파일 소유권 보호),
# 없을 때만 gpadmin_uid / gpadmin_gid 로 만든다
- name: gpadmin 기존 그룹 / 계정 조회
  ansible.builtin.getent:
    database: "{{ item }}"
    key: "{{ gpadmin_group if item == 'group' else gpadmin_user }}"
    fail_key: false
  loop: [group, passwd]

- name: gpadmin 그룹 생성 (없을 때만 gid {{ gpadmin_gid }})
  ansible.builtin.group:
    name: "{{ gpadmin_group }}"
    gid: "{{ omit if getent_group[gpadmin_group] | default(none) else gpadmin_gid }}"
    state: present

- name: gpadmin 사용자 생성 (없을 때만 uid {{ gpadmin_uid }})
  ansible.builtin.user:
    name: "{{ gpadmin_user }}"
    uid: "{{ omit if getent_passwd[gpadmin_user] | default(none) else gpadmin_uid }}"
    group: "{{ gpadmin_group }}"
    home: "{{ gpadmin_home }}"
    shell: /bin/bash
    password: "{{ gpadmin_password | password_hash('sha512') }}"
    update_password: on_create          # 기존 계정의 비밀번호는 바꾸지 않음
    create_home: true
    state: present

- name: gpadmin uid / gid 출력 (기존 계정이면 inventory 값과 다를 수 있음)
  ansible.builtin.command: "id {{ gpadmin_user }}"
  register: _gpadmin_id
  changed_when: false
  check_mode: false

- name: gpadmin 계정 정보
  ansible.builtin.debug:
    msg: >-
      {{ _gpadmin_id.stdout }}
      {{ '(기존 계정 사용)' if getent_passwd[gpadmin_user] | default(none) else '(새로 생성)' }}

- name: gpadmin .bashrc에 WHPG 환경변수 추가
  ansible.builtin.blockinfile:
    path: "{{ gpadmin_home }}/.bashrc"
    marker: "# {mark} WarehousePG Environment"
    create: true
    owner: "{{ gpadmin_user }}"
    group: "{{ gpadmin_group }}"
    block: |
      source {{ whpg_install_dir }}/greenplum_path.sh
      export COORDINATOR_DATA_DIRECTORY={{ coordinator_data_dir }}
      export PGPORT={{ whpg_coordinator_port }}
      export PGDATABASE={{ whpg_database }}
      export JAVA_HOME={{ whpg_java_home }}
      export PXF_HOME={{ pxf_home }}
      export PXF_BASE={{ pxf_base_dir }}
      export PATH=$PXF_HOME/bin:$PATH

# ---------- 8. gpadmin SSH 키 생성 및 무암호 로그인 ----------
- name: gpadmin .ssh 디렉토리 생성
  ansible.builtin.file:
    path: "{{ gpadmin_home }}/.ssh"
    state: directory
    owner: "{{ gpadmin_user }}"
    group: "{{ gpadmin_group }}"
    mode: '0700'

- name: Coordinator에서 gpadmin SSH 키 생성
  ansible.builtin.user:
    name: "{{ gpadmin_user }}"
    generate_ssh_key: true
    ssh_key_bits: "{{ gpadmin_ssh_key_bits }}"
    ssh_key_type: "{{ gpadmin_ssh_key_type }}"
    ssh_key_file: "{{ gpadmin_ssh_key_file }}"
  when: inventory_hostname == coordinator_host

- name: Coordinator의 gpadmin 공개키 가져오기
  ansible.builtin.slurp:
    src: "{{ gpadmin_ssh_key_file }}.pub"
  register: gpadmin_pubkey
  delegate_to: "{{ coordinator_host }}"
  run_once: true

- name: 모든 노드에 gpadmin authorized_keys 배포
  ansible.posix.authorized_key:
    user: "{{ gpadmin_user }}"
    key: "{{ gpadmin_pubkey['content'] | b64decode }}"
    state: present

# gpssh-exkeys 는 StrictHostKeyChecking=yes 로 접속하므로 known_hosts 에 호스트 키가 있어야 한다
# (UserKnownHostsFile /dev/null 이면 "No ED25519 host key is known ... strict checking" 으로 실패)
- name: gpadmin ssh 설정 (새 호스트 키 자동 등록)
  ansible.builtin.copy:
    dest: "{{ gpadmin_home }}/.ssh/config"
    content: |
      Host *
        StrictHostKeyChecking accept-new
    owner: "{{ gpadmin_user }}"
    group: "{{ gpadmin_group }}"
    mode: '0600'

# 클러스터 모든 호스트의 키를 gpadmin known_hosts 에 등록 (증설 시 전체 노드에 이 파일만 실행)
- name: gpadmin known_hosts 에 클러스터 호스트 키 등록
  ansible.builtin.include_tasks: known_hosts.yml

# ---------- 9. 로컬 YUM 레포지토리 ----------
- name: WHPG 로컬 YUM 레포 설정
  ansible.builtin.template:
    src: whpg-local.repo.j2
    dest: /etc/yum.repos.d/whpg-local.repo
    owner: root
    group: root
    mode: '0644'
  when: whpg_local_repo_enabled

# ---------- 9-1. CodeReady Builder(CRB) + EPEL ----------
# os_epel_enabled: true 일 때만 (기본 false, 로컬 레포 사용)
# WHPG core 의 xerces-c 가 로컬 레포에 없으면 core RPM 설치가 "nothing provides xerces-c" 로 실패
- name: CodeReady Builder / EPEL 레포
  when: os_epel_enabled | bool
  block:
    # RHEL(RHUI 포함): codeready-builder-for-rhel-<N>-...-rpms, Rocky / Alma: crb
    - name: CRB 레포 ID / 상태 조회
      ansible.builtin.shell:
        cmd: >-
          dnf repolist --all 2>/dev/null | awk 'NR > 1 {print $1, $NF}'
          | grep -E '^(codeready-builder-for-rhel-[0-9]+-[^ ]*rpms|crb) '
          | grep -vE '(debug|source)-rpms ' | head -n 1
      register: _crb_repo
      changed_when: false
      check_mode: false

    - name: CRB 레포 활성화
      ansible.builtin.command: "dnf config-manager --set-enabled {{ _crb_repo.stdout.split()[0] }}"
      when:
        - _crb_repo.stdout | length > 0
        - _crb_repo.stdout.split()[-1] != 'enabled'

    - name: CRB 레포 없음 경고
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: CodeReady Builder / crb 레포를 찾지 못했습니다. EPEL 패키지 의존성이 실패하면 직접 활성화하세요."
      when: _crb_repo.stdout | length == 0

    - name: epel-release 설치 여부 확인
      ansible.builtin.command: rpm -q epel-release
      register: _epel_installed
      changed_when: false
      failed_when: false
      check_mode: false

    - name: EPEL GPG 키 등록
      ansible.builtin.rpm_key:
        key: "{{ os_epel_gpg_key }}"
        state: present
      when: _epel_installed.rc != 0

    - name: EPEL 레포 설치 (epel-release)
      ansible.builtin.dnf:
        name: "{{ os_epel_release_rpm }}"
        state: present
      when: _epel_installed.rc != 0

# ---------- 10. 데이터 디스크 (XFS 포맷/마운트 + 블럭 디바이스 조회) ----------
- name: 데이터 디스크 구성
  ansible.builtin.import_tasks: data_disks.yml

# ---------- 10-1. 데이터 볼륨 quota (XFS project quota, 볼륨 크기의 whpg_data_quota_percent %) ----------
- name: 데이터 볼륨 quota
  ansible.builtin.include_tasks: data_quota.yml
  when: whpg_data_quota_enabled | bool

# ---------- 11. I/O 스케쥴러 udev 규칙 ----------
# 대상: 10단계에서 조회한 데이터 경로의 물리 디스크 (조회 결과가 없으면 io_udev_pattern)
- name: I/O 스케쥴러 udev 규칙 설정 (VMware/SSD용 none)
  ansible.builtin.copy:
    dest: "{{ io_udev_rules_file }}"
    content: |
      # WarehousePG I/O Scheduler Tuning
      {% for dev in (whpg_data_disks | default([])) or [io_udev_pattern] %}
      ACTION=="add|change", KERNEL=="{{ dev }}", ATTR{queue/scheduler}="{{ io_scheduler }}"
      ACTION=="add|change", KERNEL=="{{ dev }}", ATTR{bdi/read_ahead_kb}="{{ io_read_ahead_kb }}"
      {% endfor %}
    owner: root
    group: root
    mode: '0644'
  notify: reload_udev

# ---------- 12-0. 시스템 python3 = OS 기본 (RHEL 9: 3.9) ----------
# tuned 등 RHEL 도구는 #!/usr/bin/python3 로 OS 기본 Python 모듈을 쓴다 (python3 를 3.11 로 바꾸면 tuned-adm 실패).
# WHPG 7 은 greenplum_path.sh 가 PATH 앞에 $GPHOME/ext/python3.11/bin(→ /usr/bin/python3.11)을 넣어
# 시스템 python3 와 관계없이 python3.11 을 쓰므로, 시스템 python3 는 OS 기본으로 둔다
- name: 시스템 python3 확인 (기대 {{ os_system_python3 }})
  ansible.builtin.command: readlink -f /usr/bin/python3
  register: _sys_python3
  changed_when: false
  check_mode: false
  failed_when: false

- name: 시스템 python3 를 OS 기본으로 지정 (alternatives --set python3 {{ os_system_python3 }})
  ansible.builtin.command: "alternatives --set python3 {{ os_system_python3 }}"
  when:
    - os_fix_system_python3 | bool
    - _sys_python3.stdout != os_system_python3

# ---------- 12. THP 비활성화 + Read-ahead 조정 (tuned) ----------
- name: tuned 설치
  ansible.builtin.package:
    name: tuned
    state: present

- name: WHPG tuned 프로파일 디렉토리 생성
  ansible.builtin.file:
    path: "/etc/tuned/{{ tuned_profile_name }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: WHPG tuned.conf 배포
  ansible.builtin.template:
    src: tuned.conf.j2
    dest: "/etc/tuned/{{ tuned_profile_name }}/tuned.conf"
    owner: root
    group: root
    mode: '0644'

- name: tuned 서비스 활성화 및 시작
  ansible.builtin.systemd:
    name: tuned
    state: started
    enabled: true

- name: WHPG tuned 프로파일 활성화
  ansible.builtin.command:
    cmd: "tuned-adm profile {{ tuned_profile_name }}"
  changed_when: true

# ---------- 13. SSH 연결 임계값 설정 ----------
- name: sshd_config MaxStartups 설정
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?MaxStartups'
    line: "MaxStartups {{ sshd_max_startups }}"
  notify: restart_sshd

- name: sshd_config MaxSessions 설정
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?MaxSessions'
    line: "MaxSessions {{ sshd_max_sessions }}"
  notify: restart_sshd

# ---------- 14. NTP (chrony) 설정 ----------
- name: chrony 설치
  ansible.builtin.package:
    name: chrony
    state: present

- name: chrony NTP 서버 설정
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart_chronyd

- name: chronyd 서비스 활성화 및 시작
  ansible.builtin.systemd:
    name: chronyd
    state: started
    enabled: true

# ---------- 15. 필수 패키지 설치 ----------
- name: 필수 패키지 설치
  ansible.builtin.package:
    name: "{{ os_required_packages }}"
    state: present

# ---------- 16. SELinux 최종 상태 확인 ----------
# SELINUX=disabled 는 리부팅 후 적용되므로 미리부팅 노드를 식별
- name: SELinux 최종 상태 확인
  ansible.builtin.command: getenforce
  register: _selinux_final
  changed_when: false
  check_mode: false

- name: SELinux 최종 상태 출력
  ansible.builtin.debug:
    msg: >-
      {{ 'SELinux: Disabled ✓' if _selinux_final.stdout | trim == 'Disabled' else
         'SELinux 현재 모드: ' ~ (_selinux_final.stdout | trim) ~
         ' - 설정파일은 disabled, 리부팅해야 Disabled 로 적용됩니다.' }}
