---
# /etc/hosts 에 클러스터 전체 호스트 등록 (main.yml, 증설 playbook 에서 사용)
#   형식: <IP> <실제 hostname = inventory 이름> <alias>
#   alias: coordinator → cdw, standby → scdw, segment → sdw1, sdw2 ... ([segments] 순서)
#          호스트별로 바꾸려면 inventory 에서 host_alias=<이름> 지정 (빈 값이면 alias 없음)
- name: 클러스터 호스트 alias 결정
  ansible.builtin.set_fact:
    whpg_host_aliases: >-
      {%- set m = {} -%}
      {%- for host in groups['whpg_cluster'] -%}
      {%-   if hostvars[host].host_alias is defined -%}{%- set a = hostvars[host].host_alias -%}
      {%-   elif host in groups['coordinator'] -%}{%- set a = 'cdw' -%}
      {%-   elif host in groups['standby_coordinator'] | default([]) -%}{%- set a = 'scdw' -%}
      {%-   else -%}{%- set a = 'sdw' ~ (groups['segments'].index(host) + 1) -%}{%- endif -%}
      {%-   if a and a != host -%}{%- set _ = m.update({host: a}) -%}{%- endif -%}
      {%- endfor -%}
      {{ m }}

- name: /etc/hosts 클러스터 호스트 항목 추가
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} WarehousePG Cluster Hosts"
    block: |
      {% for host in groups['whpg_cluster'] %}
      {{ hostvars[host]['ansible_host'] }} {{ host }}{{ (' ' ~ whpg_host_aliases[host]) if host in whpg_host_aliases else '' }}
      {% endfor %}
