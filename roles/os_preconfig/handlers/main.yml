---
- name: reboot_required
  ansible.builtin.debug:
    msg: "SELinux 또는 cgroup 변경으로 리부팅이 필요합니다. 수동으로 reboot 후 진행하세요."

- name: update_grub
  ansible.builtin.command:
    cmd: grub2-mkconfig -o /boot/grub2/grub.cfg
  changed_when: true

- name: reload_udev
  ansible.builtin.shell:
    cmd: udevadm control --reload-rules && udevadm trigger
  changed_when: true

- name: restart_sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted

- name: restart_chronyd
  ansible.builtin.systemd:
    name: chronyd
    state: restarted

- name: restart_sssd
  ansible.builtin.systemd:
    name: sssd
    state: restarted
