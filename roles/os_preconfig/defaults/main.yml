---
# os_preconfig role 기본값 (inventory/group_vars 에서 override 가능)
# 공통 변수(gpadmin_*, xfs_*, io_*, ntp_servers 등)는 inventory/whpg_cluster.yml 참고

# ---------- SELinux / SSSD ----------
sssd_selinux_dropin_file: /etc/sssd/conf.d/90-whpg-selinux.conf

# ---------- sysctl ----------
os_sysctl_params:
  # Shared Memory
  kernel.shmmax: "500000000"
  kernel.shmmni: "4096"
  kernel.shmall: "4000000000"
  kernel.sem: "500 2048000 200 4096"
  kernel.sysrq: "1"
  kernel.core_uses_pid: "1"
  kernel.msgmnb: "65536"
  kernel.msgmax: "65536"
  kernel.msgmni: "2048"
  # Virtual Memory
  vm.overcommit_memory: "2"
  vm.overcommit_ratio: "95"
  vm.swappiness: "10"
  vm.dirty_expire_centisecs: "500"
  vm.dirty_writeback_centisecs: "100"
  vm.dirty_background_ratio: "0"
  vm.dirty_ratio: "0"
  vm.dirty_background_bytes: "1610612736"
  vm.dirty_bytes: "4294967296"
  # Network
  net.ipv4.tcp_tw_reuse: "1"
  net.ipv4.conf.all.arp_filter: "1"
  net.ipv4.ip_local_port_range: "10000 65535"
  net.core.netdev_max_backlog: "2000"
  net.core.rmem_max: "4194304"
  net.core.wmem_max: "4194304"
  net.core.rmem_default: "4194304"
  net.core.wmem_default: "4194304"
  net.core.optmem_max: "4194304"
  net.ipv4.tcp_mem: "4194304 4194304 4194304"
  net.ipv4.tcp_rmem: "4096 4194304 4194304"
  net.ipv4.tcp_wmem: "4096 4194304 4194304"
# 일부 값만 바꾸거나 추가할 때 사용 (os_sysctl_params 위에 덮어씀)
os_sysctl_params_extra: {}

# ---------- ulimits ----------
gpadmin_limits_file: "/etc/security/limits.d/95-{{ gpadmin_user }}.conf"
gpadmin_limits:
  nofile: 524288
  nproc: 131072
  core: unlimited
  memlock: unlimited

# ---------- cgroup v2 ----------
whpg_cgroup_service_name: gpdb
whpg_cgroup_controllers: "+cpu +cpuset +io +memory"

# ---------- gpadmin SSH ----------
gpadmin_ssh_key_type: rsa
gpadmin_ssh_key_bits: 4096
gpadmin_ssh_key_file: "{{ gpadmin_home }}/.ssh/id_{{ gpadmin_ssh_key_type }}"

# ---------- I/O / tuned ----------
io_udev_rules_file: /etc/udev/rules.d/99-vmware-db-scheduler.rules
io_read_ahead_kb: 16
tuned_base_profile: throughput-performance
tuned_readahead: 16

# ---------- 필수 패키지 ----------
os_required_packages:
  - rsync
  - zip
  - unzip
  - net-tools
  - bind-utils
  - lsof
  - sysstat
  - perl
  - python3
  - python3-pip
  - java-11-openjdk
  - apr
  - apr-util
  - bash-completion

# ---------- 데이터 볼륨 quota (tasks/data_quota.yml, inventory/whpg_cluster.yml 에서 조정) ----------
whpg_data_quota_enabled: true
whpg_data_quota_percent: 95
whpg_data_quota_soft_percent: 0
whpg_data_quota_project_id_base: 1001
whpg_data_quota_project_prefix: whpg

# ---------- 시스템 python3 (tasks/main.yml 12-0) ----------
# /usr/bin/python3 를 OS 기본 Python 으로 유지 (tuned 등 RHEL 도구용). WHPG 는 greenplum_path.sh 로 python3.11 사용
os_fix_system_python3: true
os_system_python3: "{{ '/usr/bin/python3.9' if ansible_distribution_major_version | int >= 9 else '/usr/bin/python3.6' }}"
