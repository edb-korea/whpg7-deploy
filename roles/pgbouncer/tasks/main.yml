---
# ======================================================
# Role: pgbouncer
# Coordinator 노드에 pgBouncer 설치 및 설정
# ======================================================

- name: pgBouncer 설치
  ansible.builtin.package:
    name: pgbouncer
    state: present

- name: pgBouncer 설정 디렉토리 생성
  ansible.builtin.file:
    path: /etc/pgbouncer
    state: directory
    owner: "{{ gpadmin_user }}"
    group: "{{ gpadmin_group }}"
    mode: '0755'

- name: pgbouncer.ini 설정파일 배포
  ansible.builtin.template:
    src: pgbouncer.ini.j2
    dest: /etc/pgbouncer/pgbouncer.ini
    owner: "{{ gpadmin_user }}"
    group: "{{ gpadmin_group }}"
    mode: '0640'
  notify: restart_pgbouncer

- name: userlist.txt 생성 (gpadmin 사용자)
  ansible.builtin.shell:
    cmd: >
      source {{ whpg_install_dir }}/greenplum_path.sh &&
      psql -d gpadmin -t -A -c
      "SELECT '\"' || usename || '\" \"' || passwd || '\"' FROM pg_shadow
       WHERE usename = 'gpadmin';" > /etc/pgbouncer/userlist.txt
  become: true
  become_user: "{{ gpadmin_user }}"
  changed_when: true

- name: pgBouncer systemd 서비스 등록
  ansible.builtin.template:
    src: pgbouncer.service.j2
    dest: /etc/systemd/system/pgbouncer.service
    owner: root
    group: root
    mode: '0644'
  notify: restart_pgbouncer

- name: pgBouncer 서비스 시작 및 활성화
  ansible.builtin.systemd:
    name: pgbouncer
    state: started
    enabled: true
    daemon_reload: true
